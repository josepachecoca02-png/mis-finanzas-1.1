<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Finanzas — Jose</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        .safe-bottom-padding { padding-bottom: max(22px, env(safe-area-inset-bottom)); }
        .safe-bottom-margin-btn { bottom: max(96px, calc(80px + env(safe-area-inset-bottom))); }
    </style>
    <!-- BLOQUEO ANTI-MIRONES BÁSICO -->
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>
</head>
<body class="bg-black text-neutral-100 min-h-screen pb-48 md:pb-6 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // PON TUS LLAVES DEL NUEVO PROYECTO AQUÍ
        const SUPABASE_URL = "https://hvjlkjyyyjqebibtffkl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ags0yzMs4NRe4nBGbIGN-g_YiFX_r9_";

        const CATEGORIAS_MOV = ['General', 'Alimentación', 'Transporte', 'Vivienda y Servicios', 'Ocio y Entretenimiento', 'Salud', 'Educación', 'Préstamo Otorgado', 'Abono a Deuda', 'Cobro Recibido', 'Ingreso Extra', 'Sueldo/Honorarios', 'Fondeo/Retiro Inversión'];

        const obtenerFechaHoraActual = () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            return ahora.toISOString().slice(0, 16);
        };
        const obtenerFechaHoy = () => new Date().toISOString().slice(0, 10);

        const CUENTAS_PREDETERMINADAS = [
            { id: "c1", nombre: "Daviplata", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c2", nombre: "Nequi", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c3", nombre: "Bancolombia", tipo: "Banco", saldo: 0, moneda: "COP", activa: true },
            { id: "c4", nombre: "Efectivo", tipo: "Efectivo", saldo: 0, moneda: "COP", activa: true },
            { id: "c5", nombre: "Binance", tipo: "Inversión", saldo: 500, saldoCOP: 0, moneda: "USD", activa: true },
            { id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true }
        ];

        const ESTADO_INICIAL = {
            cuentas: CUENTAS_PREDETERMINADAS, deudas: [], porCobrar: [], movimientos: [], destinaciones: [],
            cierresMensuales: [], trades: [], cierresInversion: [], holdings: [], cierresHolding: [], predicciones: [], cierresPredicciones: []
        };

        function Aplicacion() {
            // AUTENTICACIÓN
            const [sesion, setSesion] = useState(null);
            const [cargandoAuth, setCargandoAuth] = useState(true);
            const [emailLogin, setEmailLogin] = useState('');
            const [passLogin, setPassLogin] = useState('');
            const [errorAuth, setErrorAuth] = useState('');

            // ESTADOS GLOBALES
            const [datos, setDatos] = useState(ESTADO_INICIAL);
            const [precioUSDT, setPrecioUSDT] = useState(4000); // Default, se actualiza con API
            const [ocultarSaldos, setOcultarSaldos] = useState(false);
            const [menuAdminAbierto, setMenuAdminAbierto] = useState(false);
            const [rubroActivo, setRubroActivo] = useState('inicio');
            const [subRubroTrade, setSubRubroTrade] = useState('scalping');
            
            // UI INTERACTIVA
            const [modalVisible, setModalVisible] = useState(null);
            const [confirmacion, setConfirmacion] = useState(null);
            const [notificacion, setNotificacion] = useState(null);
            const [historialExp, setHistorialExp] = useState({}); // Para expandir sub-tablas de deudas/cobros

            const [busquedaMov, setBusquedaMov] = useState('');
            const [filtroCuentaMov, setFiltroCuentaMov] = useState('todas');

            const clienteSupabase = useRef(null);
            const inputFileRef = useRef(null);

            // 1. API BINANCE EN VIVO (USDT/COP)
            useEffect(() => {
                const fetchUSDT = async () => {
                    try {
                        const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTCOP');
                        const data = await res.json();
                        if (data && data.price) setPrecioUSDT(parseFloat(data.price));
                    } catch (e) { console.warn("Usando precio USDT fallback"); }
                };
                fetchUSDT();
                const intervalo = setInterval(fetchUSDT, 30000); // Actualiza cada 30 segundos
                return () => clearInterval(intervalo);
            }, []);

            const mostrarNotificacion = (mensaje, tipo = 'exito') => { setNotificacion({ mensaje, tipo }); setTimeout(() => setNotificacion(null), 3000); };
            const pedirConfirmacion = ({ titulo, mensaje, accion }) => setConfirmacion({ titulo, mensaje, accion });
            const cambiarRubro = (nuevoRubro) => { setBusquedaMov(''); setRubroActivo(nuevoRubro); };
            const toggleHistorial = (id) => setHistorialExp(prev => ({ ...prev, [id]: !prev[id] }));

            // 2. SUPABASE AUTH & DATOS
            useEffect(() => {
                try {
                    if (window.supabase && SUPABASE_URL !== "TU_NUEVA_URL_AQUI") {
                        clienteSupabase.current = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        clienteSupabase.current.auth.getSession().then(({ data: { session } }) => {
                            setSesion(session); setCargandoAuth(false);
                            if (session) cargarDesdeSupabase();
                        });
                        clienteSupabase.current.auth.onAuthStateChange((_event, session) => {
                            setSesion(session);
                            if (session) cargarDesdeSupabase(); else setDatos(ESTADO_INICIAL);
                        });
                    } else { setCargandoAuth(false); }
                } catch(e) { setCargandoAuth(false); }
            }, []);

            const manejarLogin = async (e) => {
                e.preventDefault();
                if (!clienteSupabase.current) return setErrorAuth("Faltan llaves de Supabase");
                setErrorAuth(''); setCargandoAuth(true);
                const { error } = await clienteSupabase.current.auth.signInWithPassword({ email: emailLogin, password: passLogin });
                if (error) { setErrorAuth('❌ Correo o contraseña incorrectos'); setCargandoAuth(false); }
            };

            const cerrarSesion = async () => { await clienteSupabase.current.auth.signOut(); mostrarNotificacion("🔒 Bóveda cerrada"); };

            const cargarDesdeSupabase = async () => {
                if (!clienteSupabase.current) return;
                try {
                    const { data: respuesta, error } = await clienteSupabase.current.from('app_data').select('content').eq('id', 'jose_finanzas').single();
                    if (error && error.code !== 'PGRST116') return;
                    if (respuesta && respuesta.content) {
                        const remoto = respuesta.content;
                        if (!remoto.cuentas) remoto.cuentas = CUENTAS_PREDETERMINADAS;
                        setDatos({ ...ESTADO_INICIAL, ...remoto });
                    } else { guardarEnSupabase(ESTADO_INICIAL); }
                } catch(err) {}
            };

            const guardarEnSupabase = async (nuevosDatos) => {
                if (!clienteSupabase.current) return;
                try { await clienteSupabase.current.from('app_data').upsert({ id: 'jose_finanzas', content: nuevosDatos, updated_at: new Date() }); } catch(err) {}
            };

            const actualizarYGuardar = (nuevosDatos) => { setDatos(nuevosDatos); guardarEnSupabase(nuevosDatos); };

            const formatearMoneda = (valor, moneda = 'COP') => {
                if (ocultarSaldos) return '••••••';
                if (moneda === 'USD') return '$' + (valor || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
                return '$' + (valor || 0).toLocaleString('es-CO') + ' COP';
            };

            const formatearFechaHora = (cadenaFecha) => {
                if (!cadenaFecha) return '';
                return new Date(cadenaFecha).toLocaleString('es-CO', { year: '2-digit', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const listaCuentas = useMemo(() => (datos?.cuentas && datos.cuentas.length > 0) ? datos.cuentas : CUENTAS_PREDETERMINADAS, [datos]);

            // 3. CÁLCULO PATRIMONIAL PROFESIONAL (CONTABILIDAD)
            const totales = useMemo(() => {
                const liquidezBrutaCOP = listaCuentas.filter(c => c.moneda === 'COP').reduce((acc, c) => acc + c.saldo, 0);
                const totalDestinado = (datos?.destinaciones || []).reduce((acc, d) => acc + (d.monto || 0), 0);
                const liquidezLibreCOP = Math.max(0, liquidezBrutaCOP - totalDestinado);

                const capScalpingUSD = listaCuentas.find(c => c.id === 'c5')?.saldo || 0;
                const capPredUSD = listaCuentas.find(c => c.id === 'c6')?.saldo || 0;
                const holdingActivoUSD = (datos?.holdings || []).filter(h => !h.cerrado).reduce((acc, h) => acc + (parseFloat(h.montoUSD) || 0), 0);
                
                const totalInversionesUSD = capScalpingUSD + capPredUSD + holdingActivoUSD;
                const totalInversionesCOP = totalInversionesUSD * precioUSDT; // CONVERSIÓN EN VIVO

                const carteraActiva = (datos?.porCobrar || []).reduce((acc, r) => acc + Math.max(0, r.montoOriginal - ((r.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const pasivosTotales = (datos?.deudas || []).reduce((acc, d) => acc + Math.max(0, d.montoOriginal - ((d.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);

                // ECUACIÓN PATRIMONIAL: (Liquidez + Destinaciones + Inversiones + Cartera) - Deudas
                const patrimonioNetoCOP = liquidezBrutaCOP + totalInversionesCOP + carteraActiva - pasivosTotales;

                return { liquidezBrutaCOP, liquidezLibreCOP, totalDestinado, capScalpingUSD, capPredUSD, holdingActivoUSD, totalInversionesUSD, totalInversionesCOP, carteraActiva, pasivosTotales, patrimonioNetoCOP };
            }, [datos, listaCuentas, precioUSDT]);

            // ESTADOS FORMULARIOS
            const [formMov, setFormMov] = useState({ id: null, concepto: '', monto: '', cuentaId: 'c1', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() });
            const [formDeuda, setFormDeuda] = useState({ id: null, entidad: '', concepto: '', montoOriginal: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoDeuda, setFormAbonoDeuda] = useState({ deudaId: '', cuentaId: 'c3', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formPorCobrar, setFormPorCobrar] = useState({ id: null, deudor: '', concepto: '', montoOriginal: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoCobro, setFormAbonoCobro] = useState({ cobroId: '', cuentaId: 'c3', monto: '', fechaHora: obtenerFechaHoraActual() });
            // ... (Mantenemos los forms de trades, predicciones y holdings igual)
            const [formDestino, setFormDestino] = useState({ id: null, nombre: '', monto: '', descripcion: '' });
            const [formEjecutarDestino, setFormEjecutarDestino] = useState({ destinacionId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });

            // FUNCIONES DE DEUDAS (MODO FLUJO DE CAJA)
            const guardarDeuda = (e) => {
                e.preventDefault();
                const orig = parseFloat(formDeuda.montoOriginal) || 0;
                let lista = [...(datos.deudas || [])];
                if (formDeuda.id) lista = lista.map(d => d.id === formDeuda.id ? { ...d, entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig } : d);
                else lista.push({ id: 'd_' + Date.now(), entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaHora: formDeuda.fechaHora, abonos: [] });
                actualizarYGuardar({ ...datos, deudas: lista });
                setModalVisible(null); mostrarNotificacion("✅ Deuda registrada");
            };

            const abonarDeuda = (e) => {
                e.preventDefault();
                const monto = parseFloat(formAbonoDeuda.monto);
                if (isNaN(monto) || monto <= 0) return mostrarNotificacion("Monto inválido", 'error');

                const cuentaUsada = listaCuentas.find(c => c.id === formAbonoDeuda.cuentaId);
                const deudaSel = (datos.deudas || []).find(d => d.id === formAbonoDeuda.deudaId);

                // 1. Restar plata del banco
                const cuentasAct = listaCuentas.map(c => c.id === formAbonoDeuda.cuentaId ? { ...c, saldo: c.saldo - monto } : c);
                // 2. Sumar abono a la deuda
                const deudasAct = (datos.deudas || []).map(d => d.id === formAbonoDeuda.deudaId ? { ...d, abonos: [...(d.abonos || []), { id: 'ab_' + Date.now(), monto, fechaHora: formAbonoDeuda.fechaHora, cuentaNombre: cuentaUsada.nombre }] } : d);
                // 3. Crear el movimiento general (Egreso)
                const nuevoMov = { id: 'm_ad_' + Date.now(), fechaHora: formAbonoDeuda.fechaHora, concepto: `Pago Deuda: ${deudaSel.entidad}`, monto, tipo: 'egreso', cuentaId: formAbonoDeuda.cuentaId, categoria: 'Abono a Deuda', moneda: 'COP' };

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, deudas: deudasAct, movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                setModalVisible(null); mostrarNotificacion("✅ Abono ejecutado y registrado");
            };

            const eliminarDeuda = (id) => { pedirConfirmacion({ titulo: "🗑️ Eliminar Deuda", mensaje: "¿Borrar este registro?", accion: () => { actualizarYGuardar({ ...datos, deudas: (datos.deudas || []).filter(d => d.id !== id) }); mostrarNotificacion("Eliminada"); } }); };

            // FUNCIONES DE ME DEBEN (CARTERA)
            const guardarPorCobrar = (e) => {
                e.preventDefault();
                const orig = parseFloat(formPorCobrar.montoOriginal) || 0;
                let lista = [...(datos.porCobrar || [])];
                if (formPorCobrar.id) lista = lista.map(r => r.id === formPorCobrar.id ? { ...r, deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig } : r);
                else lista.push({ id: 'r_' + Date.now(), deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig, fechaHora: formPorCobrar.fechaHora, abonos: [] });
                actualizarYGuardar({ ...datos, porCobrar: lista });
                setModalVisible(null); mostrarNotificacion("✅ Préstamo registrado");
            };

            const recibirAbonoCobro = (e) => {
                e.preventDefault();
                const monto = parseFloat(formAbonoCobro.monto);
                if (isNaN(monto) || monto <= 0) return mostrarNotificacion("Monto inválido", 'error');

                const cuentaDestino = listaCuentas.find(c => c.id === formAbonoCobro.cuentaId);
                const cobroSel = (datos.porCobrar || []).find(r => r.id === formAbonoCobro.cobroId);

                // 1. Sumar plata al banco
                const cuentasAct = listaCuentas.map(c => c.id === formAbonoCobro.cuentaId ? { ...c, saldo: c.saldo + monto } : c);
                // 2. Sumar abono a la cartera
                const cobrosAct = (datos.porCobrar || []).map(r => r.id === formAbonoCobro.cobroId ? { ...r, abonos: [...(r.abonos || []), { id: 'rab_' + Date.now(), monto, fechaHora: formAbonoCobro.fechaHora, cuentaNombre: cuentaDestino.nombre }] } : r);
                // 3. Crear el movimiento general (Ingreso)
                const nuevoMov = { id: 'm_rc_' + Date.now(), fechaHora: formAbonoCobro.fechaHora, concepto: `Pago Recibido: ${cobroSel.deudor}`, monto, tipo: 'ingreso', cuentaId: formAbonoCobro.cuentaId, categoria: 'Cobro Recibido', moneda: 'COP' };

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, porCobrar: cobrosAct, movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                setModalVisible(null); mostrarNotificacion("✅ Plata ingresada y registrada");
            };

            const eliminarPorCobrar = (id) => { pedirConfirmacion({ titulo: "🗑️ Eliminar Préstamo", mensaje: "¿Borrar este registro?", accion: () => { actualizarYGuardar({ ...datos, porCobrar: (datos.porCobrar || []).filter(r => r.id !== id) }); mostrarNotificacion("Eliminado"); } }); };

            // FUNCIONES GENERALES DE MOVIMIENTO
            const guardarMovimiento = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formMov.monto);
                if (isNaN(montoNum) || montoNum <= 0) return mostrarNotificacion("Monto inválido", 'error');

                let cuentasAct = [...listaCuentas];
                let movsAct = [...(datos.movimientos || [])];
                
                if (formMov.id) {
                    const movAnt = movsAct.find(m => m.id === formMov.id);
                    cuentasAct = cuentasAct.map(c => {
                        let temp = c.saldo;
                        if (movAnt && c.id === movAnt.cuentaId) temp = movAnt.tipo === 'ingreso' ? temp - movAnt.monto : temp + movAnt.monto;
                        if (c.id === formMov.cuentaId) temp = formMov.tipo === 'ingreso' ? temp + montoNum : temp - montoNum;
                        return { ...c, saldo: temp };
                    });
                    movsAct = movsAct.map(m => m.id === formMov.id ? { ...formMov, monto: montoNum } : m);
                } else {
                    cuentasAct = cuentasAct.map(c => c.id === formMov.cuentaId ? { ...c, saldo: formMov.tipo === 'ingreso' ? c.saldo + montoNum : c.saldo - montoNum } : c);
                    movsAct = [{ ...formMov, id: 'm_' + Date.now(), monto: montoNum }, ...movsAct];
                }

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, movimientos: movsAct });
                setModalVisible(null); mostrarNotificacion("✅ Movimiento guardado");
            };

            const eliminarMovimiento = (id) => {
                pedirConfirmacion({
                    titulo: "🗑️ Eliminar Movimiento", mensaje: "¿Revertir este registro?",
                    accion: () => {
                        const m = (datos.movimientos || []).find(x => x.id === id);
                        if (!m) return;
                        const cuentasAct = listaCuentas.map(c => c.id === m.cuentaId ? { ...c, saldo: m.tipo === 'ingreso' ? c.saldo - m.monto : c.saldo + m.monto } : c);
                        actualizarYGuardar({ ...datos, cuentas: cuentasAct, movimientos: datos.movimientos.filter(x => x.id !== id) });
                        mostrarNotificacion("Revertido");
                    }
                });
            };

            const movimientosFiltrados = useMemo(() => {
                let lista = datos.movimientos || [];
                if (filtroCuentaMov !== 'todas') lista = lista.filter(m => m.cuentaId === filtroCuentaMov);
                if (busquedaMov.trim()) lista = lista.filter(m => m.concepto.toLowerCase().includes(busquedaMov.toLowerCase()));
                return lista;
            }, [datos.movimientos, busquedaMov, filtroCuentaMov]);

            // INTERFAZ DE AUTENTICACIÓN
            if (cargandoAuth) return <div className="min-h-screen bg-black flex items-center justify-center text-emerald-500 font-black text-xl">Conectando Bóveda...</div>;
            
            if (!sesion) {
                return (
                    <div className="min-h-screen bg-black text-white flex items-center justify-center p-4">
                        <form onSubmit={manejarLogin} className="bg-neutral-900 border border-neutral-800 p-8 rounded-3xl max-w-xs w-full text-center space-y-6 shadow-2xl">
                            <div className="w-16 h-16 bg-neutral-950 border border-neutral-800 rounded-2xl flex items-center justify-center text-3xl mx-auto">🚀</div>
                            <div><h2 className="text-xl font-bold">Mis Finanzas</h2><p className="text-xs text-neutral-400 mt-1">Bóveda Encriptada</p></div>
                            <input type="email" required placeholder="Correo de acceso" value={emailLogin} onChange={e => { setErrorAuth(''); setEmailLogin(e.target.value); }} className="w-full bg-black border border-neutral-800 text-center text-sm font-bold py-4 rounded-xl focus:outline-none focus:border-emerald-500 text-white" />
                            <input type="password" required placeholder="Contraseña segura" value={passLogin} onChange={e => { setErrorAuth(''); setPassLogin(e.target.value); }} className="w-full bg-black border border-neutral-800 text-center text-sm font-bold py-4 rounded-xl focus:outline-none focus:border-emerald-500 text-white" />
                            {errorAuth && <p className="text-xs text-red-500 font-bold">{errorAuth}</p>}
                            <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold py-3.5 rounded-xl transition">Entrar</button>
                        </form>
                    </div>
                );
            }

            const rubros = [
                { id: 'inicio', etiqueta: '🏛️ Balance', corto: 'Balance' },
                { id: 'cuentas', etiqueta: '💳 Liquidez', corto: 'Liquidez' },
                { id: 'inversiones', etiqueta: '📈 Inversiones', corto: 'Trades' },
                { id: 'deudas', etiqueta: '🔴 Deudas', corto: 'Deudas' },
                { id: 'porCobrar', etiqueta: '🟢 Cartera', corto: 'Cartera' },
                { id: 'movimientos', etiqueta: '📜 Flujo Caja', corto: 'Flujo' }
            ];

            return (
                <div className="flex flex-col min-h-screen bg-black text-neutral-100">
                    <input type="file" ref={inputFileRef} onChange={/* logica import */} accept=".json" className="hidden" />

                    {notificacion && (
                        <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl font-bold text-xs shadow-2xl border backdrop-blur-md transition-all ${notificacion.tipo === 'exito' ? 'bg-emerald-950/90 text-emerald-400 border-emerald-500/40' : 'bg-red-950/90 text-red-400 border-red-500/40'}`}>
                            {notificacion.mensaje}
                        </div>
                    )}

                    {confirmacion && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-[70]">
                            <div className="bg-neutral-900 border border-neutral-800 p-6 rounded-3xl max-w-sm w-full text-center space-y-5 shadow-2xl">
                                <div className="text-xl font-bold text-white">{confirmacion.titulo}</div>

                                <div><label className="text-xs text-neutral-400">Concepto Libre</label><input type="text" required value={formMov.concepto} onChange={e => setFormMov({ ...formMov, concepto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Monto</label><input type="number" required value={formMov.monto} onChange={e => setFormMov({ ...formMov, monto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1 font-bold text-lg" /></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 py-3 rounded-xl font-extrabold">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'abonoDeuda' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={abonarDeuda} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Pagar Cuota de Deuda</h3>
                                <p className="text-xs text-neutral-400">El dinero saldrá de la cuenta que elijas y se registrará como egreso en tu flujo de caja.</p>
                                <div><label className="text-xs text-neutral-400">Monto a pagar</label><input type="number" required value={formAbonoDeuda.monto} onChange={e => setFormAbonoDeuda({ ...formAbonoDeuda, monto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1 font-bold text-xl" /></div>
                                <div><label className="text-xs text-red-400 font-bold">Sacar plata desde:</label><select value={formAbonoDeuda.cuentaId} onChange={e => setFormAbonoDeuda({ ...formAbonoDeuda, cuentaId: e.target.value })} className="w-full bg-black border border-red-500/50 text-white font-bold rounded-xl p-3 mt-1">{listaCuentas.filter(c => c.moneda === 'COP').map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-red-600 text-white py-3 rounded-xl font-extrabold">Abonar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'abonoCobro' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={recibirAbonoCobro} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Recibir Pago de Cartera</h3>
                                <p className="text-xs text-neutral-400">El dinero entrará a la cuenta que elijas y se registrará como ingreso en tu flujo de caja.</p>
                                <div><label className="text-xs text-neutral-400">Monto recuperado</label><input type="number" required value={formAbonoCobro.monto} onChange={e => setFormAbonoCobro({ ...formAbonoCobro, monto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1 font-bold text-xl" /></div>
                                <div><label className="text-xs text-cyan-400 font-bold">Ingresar plata a:</label><select value={formAbonoCobro.cuentaId} onChange={e => setFormAbonoCobro({ ...formAbonoCobro, cuentaId: e.target.value })} className="w-full bg-black border border-cyan-500/50 text-white font-bold rounded-xl p-3 mt-1">{listaCuentas.filter(c => c.moneda === 'COP').map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-cyan-500 text-neutral-950 py-3 rounded-xl font-extrabold">Recibir</button></div>
                            </form>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Aplicacion/>);
    </script>
</body>
</html>
