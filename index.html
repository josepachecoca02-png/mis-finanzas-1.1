<!DOCTYPE html>
<html lang="es-419">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Finanzas — Jose</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 md:pb-0">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 🔑 Credenciales incrustadas de Supabase
        const SUPABASE_URL = "https://qdwqxnuccqzmkzffqlun.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3raAVklcVTD0xtDGTPntHA_VrtJ9u_H";

        const getNowIso = () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            return now.toISOString().slice(0, 16);
        };

        const INITIAL_STATE = {
            currentUser: { username: "jose", fullName: "Jose" },
            accounts: [
                { id: "a1", name: "Daviplata", type: "digital_wallet", balance: 0, active: true },
                { id: "a2", name: "Nequi", type: "digital_wallet", balance: 0, active: true },
                { id: "a3", name: "Bancolombia", type: "bank", balance: 0, active: true },
                { id: "a4", name: "Binance", type: "investment", balance: 0, active: true },
                { id: "a5", name: "Efectivo", type: "cash", balance: 0, active: true }
            ],
            pockets: [],
            debts: [],
            receivables: [],
            transactions: [],
            allocations: [],
            monthlyClosures: []
        };

        function App() {
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem('mis_finanzas_jose_v12');
                    return saved ? JSON.parse(saved) : INITIAL_STATE;
                } catch(e) { return INITIAL_STATE; }
            });

            const [syncStatus, setSyncStatus] = useState('idle');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [showModal, setShowModal] = useState(null);

            const supabaseRef = useRef(null);

            // Supabase client initialization
            useEffect(() => {
                if (SUPABASE_URL && SUPABASE_ANON_KEY) {
                    try {
                        supabaseRef.current = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        fetchFromSupabase();
                    } catch(e) {
                        setSyncStatus('error');
                    }
                }
            }, []);

            // Localstorage sync
            useEffect(() => {
                try {
                    localStorage.setItem('mis_finanzas_jose_v12', JSON.stringify(data));
                } catch(e) {}
            }, [data]);

            const fetchFromSupabase = async () => {
                if (!supabaseRef.current) return;
                setSyncStatus('syncing');
                try {
                    const { data: res, error } = await supabaseRef.current
                        .from('app_data')
                        .select('content')
                        .eq('id', 'jose_finanzas')
                        .single();

                    if (error && error.code !== 'PGRST116') {
                        setSyncStatus('error');
                        return;
                    }

                    if (res && res.content && Object.keys(res.content).length > 0) {
                        setData(res.content);
                        setSyncStatus('success');
                    } else {
                        pushToSupabase(data);
                    }
                } catch(err) {
                    setSyncStatus('error');
                }
            };

            const pushToSupabase = async (newData) => {
                if (!supabaseRef.current) return;
                setSyncStatus('syncing');
                try {
                    const { error } = await supabaseRef.current
                        .from('app_data')
                        .upsert({ id: 'jose_finanzas', content: newData, updated_at: new Date() });

                    if (!error) {
                        setSyncStatus('success');
                    } else {
                        setSyncStatus('error');
                    }
                } catch(err) {
                    setSyncStatus('error');
                }
            };

            const updateDataAndSync = (newData) => {
                setData(newData);
                pushToSupabase(newData);
            };

            // Formateadores
            const formatCurrency = (val) => '$' + (val || 0).toLocaleString('es-CO');
            const formatDateTime = (dtStr) => {
                if (!dtStr) return '';
                const d = new Date(dtStr);
                return d.toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            // Totales con deducción de destinaciones
            const totals = useMemo(() => {
                const saldoBrutoDisponible = (data.accounts || []).filter(a => a.type !== 'investment').reduce((acc, a) => acc + (a.active ? a.balance : 0), 0);
                const inversiones = (data.accounts || []).filter(a => a.type === 'investment').reduce((acc, a) => acc + (a.active ? a.balance : 0), 0);
                const totalDestinado = (data.allocations || []).reduce((acc, al) => acc + (al.amount || 0), 0);
                
                // Disponible Real resta lo asignado a destinaciones
                const disponibleReal = Math.max(0, saldoBrutoDisponible - totalDestinado);

                const meDeben = (data.receivables || []).reduce((acc, r) => acc + Math.max(0, r.original - ((r.payments || []).reduce((pAcc, p) => pAcc + p.amount, 0))), 0);
                const debo = (data.debts || []).reduce((acc, d) => acc + Math.max(0, d.original - ((d.payments || []).reduce((pAcc, p) => pAcc + p.amount, 0))), 0);
                const patrimonioNeto = disponibleReal + inversiones + totalDestinado + meDeben - debo;

                return { saldoBrutoDisponible, totalDestinado, disponibleReal, inversiones, meDeben, debo, patrimonioNeto };
            }, [data]);

            // Forms state
            const [formTx, setFormTx] = useState({ id: null, concept: '', amount: '', accountId: 'a1', type: 'income', category: 'General', dateTime: getNowIso() });
            const [formPocket, setFormPocket] = useState({ id: null, name: '', target: '', current: '', accountId: 'a1' });
            const [formAlloc, setFormAlloc] = useState({ id: null, name: '', amount: '', description: '' });
            const [formDebt, setFormDebt] = useState({ id: null, entity: '', concept: '', original: '', dueDate: '', dateTime: getNowIso() });
            const [formDebtPayment, setFormDebtPayment] = useState({ debtId: '', accountId: 'a1', amount: '', dateTime: getNowIso() });
            const [formReceivable, setFormReceivable] = useState({ id: null, debtor: '', concept: '', original: '', agreedDate: '', dateTime: getNowIso() });
            const [formRecPayment, setFormRecPayment] = useState({ recId: '', accountId: 'a1', amount: '', dateTime: getNowIso() });
            const [closureName, setClosureName] = useState('');

            // Handlers Movimientos
            const handleSaveTransaction = (e) => {
                e.preventDefault();
                const amt = parseFloat(formTx.amount);
                if (isNaN(amt) || amt <= 0) return alert("Monto inválido");

                let updatedAccounts = [...data.accounts];
                let updatedTxList = [...data.transactions];

                if (formTx.id) {
                    const oldTx = data.transactions.find(t => t.id === formTx.id);
                    updatedAccounts = updatedAccounts.map(a => {
                        let bal = a.balance;
                        if (oldTx && a.id === oldTx.accountId) bal = oldTx.type === 'income' ? bal - oldTx.amount : bal + oldTx.amount;
                        if (a.id === formTx.accountId) bal = formTx.type === 'income' ? bal + amt : bal - amt;
                        return { ...a, balance: bal };
                    });
                    updatedTxList = updatedTxList.map(t => t.id === formTx.id ? { ...t, dateTime: formTx.dateTime, concept: formTx.concept, amount: amt, type: formTx.type, accountId: formTx.accountId, category: formTx.category } : t);
                } else {
                    updatedAccounts = updatedAccounts.map(a => a.id === formTx.accountId ? { ...a, balance: formTx.type === 'income' ? a.balance + amt : a.balance - amt } : a);
                    const newTx = { id: 't' + Date.now(), dateTime: formTx.dateTime || getNowIso(), concept: formTx.concept, amount: amt, type: formTx.type, accountId: formTx.accountId, category: formTx.category };
                    updatedTxList = [newTx, ...updatedTxList];
                }

                updateDataAndSync({ ...data, accounts: updatedAccounts, transactions: updatedTxList });
                setShowModal(null);
            };

            const handleDeleteTransaction = (id) => {
                if (!confirm("¿Seguro que deseas eliminar este movimiento?")) return;
                const tx = data.transactions.find(t => t.id === id);
                if (!tx) return;
                const updatedAccounts = data.accounts.map(a => a.id === tx.accountId ? { ...a, balance: tx.type === 'income' ? a.balance - tx.amount : a.balance + tx.amount } : a);
                updateDataAndSync({ ...data, accounts: updatedAccounts, transactions: data.transactions.filter(t => t.id !== id) });
            };

            // Handlers Bolsillos
            const handleSavePocket = (e) => {
                e.preventDefault();
                const target = parseFloat(formPocket.target) || 0;
                const current = parseFloat(formPocket.current) || 0;
                let updated = [...data.pockets];
                if (formPocket.id) {
                    updated = updated.map(p => p.id === formPocket.id ? { ...p, name: formPocket.name, target, current, accountId: formPocket.accountId } : p);
                } else {
                    updated.push({ id: 'p' + Date.now(), name: formPocket.name, target, current, accountId: formPocket.accountId });
                }
                updateDataAndSync({ ...data, pockets: updated });
                setShowModal(null);
            };

            const handleDeletePocket = (id) => {
                if (!confirm("¿Deseas eliminar este bolsillo?")) return;
                updateDataAndSync({ ...data, pockets: data.pockets.filter(p => p.id !== id) });
            };

            // Handlers Destinaciones
            const handleSaveAlloc = (e) => {
                e.preventDefault();
                const amt = parseFloat(formAlloc.amount) || 0;
                let updated = [...(data.allocations || [])];
                if (formAlloc.id) {
                    updated = updated.map(a => a.id === formAlloc.id ? { ...a, name: formAlloc.name, amount: amt, description: formAlloc.description } : a);
                } else {
                    updated.push({ id: 'al' + Date.now(), name: formAlloc.name, amount: amt, description: formAlloc.description });
                }
                updateDataAndSync({ ...data, allocations: updated });
                setShowModal(null);
            };

            const handleDeleteAlloc = (id) => {
                if (!confirm("¿Deseas eliminar esta destinación?")) return;
                updateDataAndSync({ ...data, allocations: (data.allocations || []).filter(a => a.id !== id) });
            };

            // Handlers Deudas
            const handleSaveDebt = (e) => {
                e.preventDefault();
                const orig = parseFloat(formDebt.original) || 0;
                let updated = [...data.debts];
                if (formDebt.id) {
                    updated = updated.map(d => d.id === formDebt.id ? { ...d, entity: formDebt.entity, concept: formDebt.concept, original: orig, dueDate: formDebt.dueDate, dateTime: formDebt.dateTime } : d);
                } else {
                    updated.push({ id: 'd' + Date.now(), entity: formDebt.entity, concept: formDebt.concept, original: orig, dueDate: formDebt.dueDate, dateTime: formDebt.dateTime || getNowIso(), payments: [] });
                }
                updateDataAndSync({ ...data, debts: updated });
                setShowModal(null);
            };

            const handleDeleteDebt = (id) => {
                if (!confirm("¿Deseas eliminar esta deuda?")) return;
                updateDataAndSync({ ...data, debts: data.debts.filter(d => d.id !== id) });
            };

            const handlePayDebt = (e) => {
                e.preventDefault();
                const amt = parseFloat(formDebtPayment.amount);
                if (isNaN(amt) || amt <= 0) return alert("Monto inválido");

                const updatedAccounts = data.accounts.map(a => a.id === formDebtPayment.accountId ? { ...a, balance: a.balance - amt } : a);
                const updatedDebts = data.debts.map(d => {
                    if (d.id === formDebtPayment.debtId) {
                        return { ...d, payments: [...(d.payments || []), { id: 'pay' + Date.now(), amount: amt, dateTime: formDebtPayment.dateTime || getNowIso(), accountId: formDebtPayment.accountId }] };
                    }
                    return d;
                });
                const newTx = { id: 't' + Date.now(), dateTime: formDebtPayment.dateTime || getNowIso(), concept: `Abono Deuda: ${data.debts.find(d => d.id === formDebtPayment.debtId)?.entity || ''}`, amount: amt, type: 'expense', accountId: formDebtPayment.accountId, category: 'Pago Deuda' };

                updateDataAndSync({ ...data, accounts: updatedAccounts, debts: updatedDebts, transactions: [newTx, ...data.transactions] });
                setShowModal(null);
            };

            // Handlers Me Deben
            const handleSaveReceivable = (e) => {
                e.preventDefault();
                const orig = parseFloat(formReceivable.original) || 0;
                let updated = [...data.receivables];
                if (formReceivable.id) {
                    updated = updated.map(r => r.id === formReceivable.id ? { ...r, debtor: formReceivable.debtor, concept: formReceivable.concept, original: orig, agreedDate: formReceivable.agreedDate, dateTime: formReceivable.dateTime } : r);
                } else {
                    updated.push({ id: 'r' + Date.now(), debtor: formReceivable.debtor, concept: formReceivable.concept, original: orig, agreedDate: formReceivable.agreedDate, dateTime: formReceivable.dateTime || getNowIso(), payments: [] });
                }
                updateDataAndSync({ ...data, receivables: updated });
                setShowModal(null);
            };

            const handleDeleteReceivable = (id) => {
                if (!confirm("¿Deseas eliminar este registro?")) return;
                updateDataAndSync({ ...data, receivables: data.receivables.filter(r => r.id !== id) });
            };

            const handleReceivePayment = (e) => {
                e.preventDefault();
                const amt = parseFloat(formRecPayment.amount);
                if (isNaN(amt) || amt <= 0) return alert("Monto inválido");

                const updatedAccounts = data.accounts.map(a => a.id === formRecPayment.accountId ? { ...a, balance: a.balance + amt } : a);
                const updatedReceivables = data.receivables.map(r => {
                    if (r.id === formRecPayment.recId) {
                        return { ...r, payments: [...(r.payments || []), { id: 'rpay' + Date.now(), amount: amt, dateTime: formRecPayment.dateTime || getNowIso(), accountId: formRecPayment.accountId }] };
                    }
                    return r;
                });
                const newTx = { id: 't' + Date.now(), dateTime: formRecPayment.dateTime || getNowIso(), concept: `Abono Recibido: ${data.receivables.find(r => r.id === formRecPayment.recId)?.debtor || ''}`, amount: amt, type: 'income', accountId: formRecPayment.accountId, category: 'Cobro Préstamo' };

                updateDataAndSync({ ...data, accounts: updatedAccounts, receivables: updatedReceivables, transactions: [newTx, ...data.transactions] });
                setShowModal(null);
            };

            // Handlers Cierre de Mes
            const handleCreateClosure = (e) => {
                e.preventDefault();
                if (!closureName.trim()) return alert("Ingresa un nombre para el mes");

                const closureRecord = {
                    id: 'close_' + Date.now(),
                    monthName: closureName.trim(),
                    closedAt: getNowIso(),
                    snapshot: { ...totals }
                };

                const updatedClosures = [closureRecord, ...(data.monthlyClosures || [])];
                updateDataAndSync({ ...data, monthlyClosures: updatedClosures });
                setClosureName('');
                setShowModal(null);
                alert("✅ Cierre de mes guardado exitosamente en tu historial.");
            };

            const navItems = [
                { id: 'dashboard', label: '📊 Dashboard', short: 'Inicio' },
                { id: 'accounts', label: '💳 Cuentas', short: 'Cuentas' },
                { id: 'destinacion', label: '🎯 Destinaciones', short: 'Destinos' },
                { id: 'pockets', label: '🐷 Bolsillos', short: 'Bolsillos' },
                { id: 'debts', label: '📤 Deudas', short: 'Deudas' },
                { id: 'receivables', label: '📥 Me Deben', short: 'Me Deben' },
                { id: 'transactions', label: '📜 Movimientos', short: 'Historial' },
                { id: 'closures', label: '🔒 Cierre de Mes', short: 'Cierres' }
            ];

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-slate-950 text-slate-100">
                    
                    {/* BARRA SUPERIOR DESKTOP Y MÓVIL */}
                    <header className="bg-slate-900 border-b border-slate-800 p-4 flex items-center justify-between sticky top-0 z-30">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20">J</div>
                            <div>
                                <h1 className="font-bold text-white text-base leading-none">Mis Finanzas</h1>
                                <span className="text-[11px] text-emerald-400 font-semibold">Jose Pacheco</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${syncStatus === 'syncing' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : syncStatus === 'success' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-rose-500/10 text-rose-400 border-rose-500/30'}`}>
                                {syncStatus === 'syncing' ? '⏳ Sincronizando' : syncStatus === 'success' ? '⚡ En línea' : '❌ Error Cloud'}
                            </span>
                            <button onClick={() => { setFormTx({ id: null, concept: '', amount: '', accountId: 'a1', type: 'income', category: 'General', dateTime: getNowIso() }); setShowModal('tx'); }} className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-extrabold transition active:scale-95">
                                + Movimiento
                            </button>
                        </div>
                    </header>

                    {/* BARRA LATERAL DESKTOP */}
                    <aside className="hidden md:flex w-64 bg-slate-900 border-r border-slate-800 p-4 flex-col justify-between shrink-0">
                        <div className="space-y-1">
                            {navItems.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${
                                        activeTab === tab.id ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 hover:bg-slate-800 hover:text-white'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <div className="pt-4 border-t border-slate-800">
                            <button onClick={fetchFromSupabase} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold py-2.5 rounded-xl border border-slate-700 transition">
                                🔄 Forzar Recarga Cloud
                            </button>
                        </div>
                    </aside>

                    {/* MENÚ INFERIOR MÓVIL (BOTTOM NAV) */}
                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-2 py-2 flex items-center justify-around z-40 overflow-x-auto">
                        {navItems.map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center py-1 px-2 min-w-[58px] rounded-lg text-[10px] font-bold transition ${
                                    activeTab === tab.id ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-400 hover:text-slate-200'
                                }`}
                            >
                                <span className="text-base">{tab.label.split(' ')[0]}</span>
                                <span className="mt-0.5 truncate">{tab.short}</span>
                            </button>
                        ))}
                    </nav>

                    {/* CONTENIDO PRINCIPAL */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto max-w-5xl mx-auto w-full space-y-6">
                        
                        {/* ENCABEZADO DE PESTAÑA */}
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                            <div>
                                <h2 className="text-lg md:text-2xl font-black text-white uppercase tracking-wider">{navItems.find(n => n.id === activeTab)?.label}</h2>
                                <p className="text-xs text-slate-400">Finanzas Personales de Jose</p>
                            </div>
                        </div>

                        {/* DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4 md:space-y-6">
                                {/* TARJETA PRINCIPAL DE PATRIMONIO */}
                                <div className="bg-gradient-to-br from-slate-900 via-slate-900 to-emerald-950/40 border border-emerald-500/30 rounded-2xl p-5 md:p-6 shadow-xl">
                                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Patrimonio Neto Total</span>
                                    <div className="text-3xl md:text-5xl font-black text-white mt-1">
                                        {formatCurrency(totals.patrimonioNeto)} <span className="text-xs font-normal text-slate-400">COP</span>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3 mt-5 pt-4 border-t border-slate-800/80 text-xs">
                                        <div>
                                            <div className="text-slate-400 text-[11px]">💰 Disponible Real</div>
                                            <div className="text-emerald-400 font-extrabold text-base mt-0.5">{formatCurrency(totals.disponibleReal)}</div>
                                            <div className="text-[10px] text-slate-500">Ya descontó los destinos</div>
                                        </div>
                                        <div>
                                            <div className="text-slate-400 text-[11px]">🎯 Fondos Destinados</div>
                                            <div className="text-cyan-400 font-extrabold text-base mt-0.5">{formatCurrency(totals.totalDestinado)}</div>
                                            <div className="text-[10px] text-slate-500">Reservado exclusivamente</div>
                                        </div>
                                    </div>
                                </div>

                                {/* DESGLOSE DE MÉTRICAS */}
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <div className="text-xs text-slate-400 font-semibold">📈 Inversiones</div>
                                        <div className="text-lg font-bold text-amber-400 mt-1">{formatCurrency(totals.inversiones)}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <div className="text-xs text-slate-400 font-semibold">🤝 Me Deben</div>
                                        <div className="text-lg font-bold text-cyan-400 mt-1">{formatCurrency(totals.meDeben)}</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl col-span-2 md:col-span-2">
                                        <div className="text-xs text-slate-400 font-semibold">🔴 Total que Debo</div>
                                        <div className="text-lg font-bold text-rose-400 mt-1">{formatCurrency(totals.debo)}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MIS CUENTAS */}
                        {activeTab === 'accounts' && (
                            <div className="space-y-3">
                                <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                    <div className="text-xs text-slate-400">Saldo Total en Cuentas (Bruto):</div>
                                    <div className="text-xl font-black text-white mt-1">{formatCurrency(totals.saldoBrutoDisponible)}</div>

                                    <input type="number" required placeholder="0" value={formPocket.target} onChange={e => setFormPocket({ ...formPocket, target: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Saldo Actual (COP)</label>
                                    <input type="number" required placeholder="0" value={formPocket.current} onChange={e => setFormPocket({ ...formPocket, current: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModal(null)} className="w-1/2 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="w-1/2 bg-fuchsia-600 text-white py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showModal === 'debt' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={handleSaveDebt} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">{formDebt.id ? 'Editar Deuda' : 'Registrar Deuda'}</h3>
                                <div>
                                    <label className="text-xs text-slate-400">A quién le debo</label>
                                    <input type="text" required placeholder="Ej: Banco" value={formDebt.entity} onChange={e => setFormDebt({ ...formDebt, entity: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Concepto</label>
                                    <input type="text" required placeholder="Ej: Préstamo" value={formDebt.concept} onChange={e => setFormDebt({ ...formDebt, concept: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Monto Original (COP)</label>
                                    <input type="number" required placeholder="0" value={formDebt.original} onChange={e => setFormDebt({ ...formDebt, original: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModal(null)} className="w-1/2 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="w-1/2 bg-rose-600 text-white py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showModal === 'debtPayment' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={handlePayDebt} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Abono a Deuda</h3>
                                <div>
                                    <label className="text-xs text-slate-400">Monto del Abono (COP)</label>
                                    <input type="number" required placeholder="0" value={formDebtPayment.amount} onChange={e => setFormDebtPayment({ ...formDebtPayment, amount: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Cuenta de Salida</label>
                                    <select value={formDebtPayment.accountId} onChange={e => setFormDebtPayment({ ...formDebtPayment, accountId: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1">
                                        {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name} ({formatCurrency(a.balance)})</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModal(null)} className="w-1/2 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="w-1/2 bg-rose-600 text-white py-3 rounded-xl font-bold">Abonar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showModal === 'receivable' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={handleSaveReceivable} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">{formReceivable.id ? 'Editar Préstamo' : 'Registrar Me Deben'}</h3>
                                <div>
                                    <label className="text-xs text-slate-400">Quién me debe</label>
                                    <input type="text" required placeholder="Ej: Juan" value={formReceivable.debtor} onChange={e => setFormReceivable({ ...formReceivable, debtor: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Concepto</label>
                                    <input type="text" required placeholder="Ej: Préstamo" value={formReceivable.concept} onChange={e => setFormReceivable({ ...formReceivable, concept: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Monto Original (COP)</label>
                                    <input type="number" required placeholder="0" value={formReceivable.original} onChange={e => setFormReceivable({ ...formReceivable, original: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModal(null)} className="w-1/2 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="w-1/2 bg-cyan-600 text-white py-3 rounded-xl font-bold">Guardar</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {showModal === 'recPayment' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={handleReceivePayment} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Abono Recibido</h3>
                                <div>
                                    <label className="text-xs text-slate-400">Monto Recibido (COP)</label>
                                    <input type="number" required placeholder="0" value={formRecPayment.amount} onChange={e => setFormRecPayment({ ...formRecPayment, amount: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">Cuenta de Ingreso</label>
                                    <select value={formRecPayment.accountId} onChange={e => setFormRecPayment({ ...formRecPayment, accountId: e.target.value })} className="w-full bg-slate-800 border border-slate-700 text-white rounded-xl p-3 mt-1">
                                        {data.accounts.map(a => <option key={a.id} value={a.id}>{a.name} ({formatCurrency(a.balance)})</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2">
                                    <button type="button" onClick={() => setShowModal(null)} className="w-1/2 bg-slate-800 text-slate-300 py-3 rounded-xl font-bold">Cancelar</button>
                                    <button type="submit" className="w-1/2 bg-cyan-600 text-white py-3 rounded-xl font-bold">Registrar Recibo</button>
                                </div>
                            </form>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App/>);
    </script>
</body>
</html>
