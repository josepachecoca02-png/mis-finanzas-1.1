<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Finanzas — Jose</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel CDN for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    </style>
</head>
<body class="bg-black text-neutral-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 🔑 Credenciales incrustadas de Supabase
        const SUPABASE_URL = "https://qdwqxnuccqzmkzffqlun.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3raAVklcVTD0xtDGTPntHA_VrtJ9u_H";

        const obtenerFechaHoraActual = () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            return ahora.toISOString().slice(0, 16);
        };

        const ESTADO_INICIAL = {
            usuarioActual: { nombreUsuario: "jose", nombreCompleto: "Jose Pacheco" },
            cuentas: [
                { id: "c1", nombre: "Daviplata", tipo: "Billetera Digital", saldo: 0, activa: true },
                { id: "c2", nombre: "Nequi", tipo: "Billetera Digital", saldo: 0, activa: true },
                { id: "c3", nombre: "Bancolombia", tipo: "Banco", saldo: 0, activa: true },
                { id: "c4", nombre: "Binance", tipo: "Inversión", saldo: 0, activa: true },
                { id: "c5", nombre: "Efectivo", tipo: "Efectivo", saldo: 0, activa: true }
            ],
            bolsillos: [],
            deudas: [],
            porCobrar: [],
            movimientos: [],
            destinaciones: [],
            cierresMensuales: []
        };

        function Aplicacion() {
            const [datos, setDatos] = useState(() => {
                try {
                    const guardado = localStorage.getItem('mis_finanzas_jose_v13');
                    return guardado ? JSON.parse(guardado) : ESTADO_INICIAL;
                } catch(e) { return ESTADO_INICIAL; }
            });

            const [estadoSincro, setEstadoSincro] = useState('espera'); // espera, sincronizando, exito, error
            const [pestanaActiva, setPestanaActiva] = useState('inicio');
            const [modalVisible, setModalVisible] = useState(null);
            const [menuMovilAbierto, setMenuMovilAbierto] = useState(false);

            const clienteSupabase = useRef(null);

            // Inicializar Supabase
            useEffect(() => {
                if (SUPABASE_URL && SUPABASE_ANON_KEY) {
                    try {
                        clienteSupabase.current = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        cargarDesdeSupabase();
                    } catch(e) {
                        setEstadoSincro('error');
                    }
                }
            }, []);

            // Guardar localmente
            useEffect(() => {
                try {
                    localStorage.setItem('mis_finanzas_jose_v13', JSON.stringify(datos));
                } catch(e) {}
            }, [datos]);

            const cargarDesdeSupabase = async () => {
                if (!clienteSupabase.current) return;
                setEstadoSincro('sincronizando');
                try {
                    const { data: respuesta, error } = await clienteSupabase.current
                        .from('app_data')
                        .select('content')
                        .eq('id', 'jose_finanzas')
                        .single();

                    if (error && error.code !== 'PGRST116') {
                        setEstadoSincro('error');
                        return;
                    }

                    if (respuesta && respuesta.content && Object.keys(respuesta.content).length > 0) {
                        setDatos(respuesta.content);
                        setEstadoSincro('exito');
                    } else {
                        guardarEnSupabase(datos);
                    }
                } catch(err) {
                    setEstadoSincro('error');
                }
            };

            const guardarEnSupabase = async (nuevosDatos) => {
                if (!clienteSupabase.current) return;
                setEstadoSincro('sincronizando');
                try {
                    const { error } = await clienteSupabase.current
                        .from('app_data')
                        .upsert({ id: 'jose_finanzas', content: nuevosDatos, updated_at: new Date() });

                    if (!error) {
                        setEstadoSincro('exito');
                    } else {
                        setEstadoSincro('error');
                    }
                } catch(err) {
                    setEstadoSincro('error');
                }
            };

            const actualizarYGuardar = (nuevosDatos) => {
                setDatos(nuevosDatos);
                guardarEnSupabase(nuevosDatos);
            };

            // Formateadores en español
            const formatearMoneda = (valor) => '$' + (valor || 0).toLocaleString('es-CO');
            const formatearFechaHora = (cadenaFecha) => {
                if (!cadenaFecha) return '';
                const d = new Date(cadenaFecha);
                return d.toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            // Totales con deducción automática de destinaciones
            const totales = useMemo(() => {
                const saldoBruto = (datos.cuentas || []).filter(c => c.tipo !== 'Inversión').reduce((acc, c) => acc + (c.activa ? c.saldo : 0), 0);
                const inversiones = (datos.cuentas || []).filter(c => c.tipo === 'Inversión').reduce((acc, c) => acc + (c.activa ? c.saldo : 0), 0);
                const totalDestinado = (datos.destinaciones || []).reduce((acc, d) => acc + (d.monto || 0), 0);
                
                // Disponible real descuenta los fondos asignados
                const disponibleReal = Math.max(0, saldoBruto - totalDestinado);

                const porCobrar = (datos.porCobrar || []).reduce((acc, r) => acc + Math.max(0, r.montoOriginal - ((r.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const deudas = (datos.deudas || []).reduce((acc, d) => acc + Math.max(0, d.montoOriginal - ((d.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const patrimonioNeto = disponibleReal + inversiones + totalDestinado + porCobrar - deudas;

                return { saldoBruto, totalDestinado, disponibleReal, inversiones, porCobrar, deudas, patrimonioNeto };
            }, [datos]);

            // Formularios
            const [formMov, setFormMov] = useState({ id: null, concepto: '', monto: '', cuentaId: 'c1', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() });
            const [formBolsillo, setFormBolsillo] = useState({ id: null, nombre: '', meta: '', actual: '', cuentaId: 'c1' });
            const [formDestino, setFormDestino] = useState({ id: null, nombre: '', monto: '', descripcion: '' });
            const [formDeuda, setFormDeuda] = useState({ id: null, entidad: '', concepto: '', montoOriginal: '', fechaVencimiento: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoDeuda, setFormAbonoDeuda] = useState({ deudaId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formPorCobrar, setFormPorCobrar] = useState({ id: null, deudor: '', concepto: '', montoOriginal: '', fechaAcordada: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoCobro, setFormAbonoCobro] = useState({ cobroId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [nombreCierre, setNombreCierre] = useState('');

            // Gestores de Movimientos
            const guardarMovimiento = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formMov.monto);
                if (isNaN(montoNum) || montoNum <= 0) return alert("Por favor ingresa un monto válido.");

                let cuentasActualizadas = [...datos.cuentas];
                let movimientosActualizados = [...datos.movimientos];

                if (formMov.id) {
                    const movAnterior = datos.movimientos.find(m => m.id === formMov.id);
                    cuentasActualizadas = cuentasActualizadas.map(c => {
                        let saldoTemp = c.saldo;
                        if (movAnterior && c.id === movAnterior.cuentaId) {
                            saldoTemp = movAnterior.tipo === 'ingreso' ? saldoTemp - movAnterior.monto : saldoTemp + movAnterior.monto;
                        }
                        if (c.id === formMov.cuentaId) {
                            saldoTemp = formMov.tipo === 'ingreso' ? saldoTemp + montoNum : saldoTemp - montoNum;
                        }
                        return { ...c, saldo: saldoTemp };
                    });
                    movimientosActualizados = movimientosActualizados.map(m => m.id === formMov.id ? { ...m, fechaHora: formMov.fechaHora, concepto: formMov.concepto, monto: montoNum, tipo: formMov.tipo, cuentaId: formMov.cuentaId, categoria: formMov.categoria } : m);
                } else {
                    cuentasActualizadas = cuentasActualizadas.map(c => c.id === formMov.cuentaId ? { ...c, saldo: formMov.tipo === 'ingreso' ? c.saldo + montoNum : c.saldo - montoNum } : c);
                    const nuevoMov = { id: 'm_' + Date.now(), fechaHora: formMov.fechaHora || obtenerFechaHoraActual(), concepto: formMov.concepto, monto: montoNum, tipo: formMov.tipo, cuentaId: formMov.cuentaId, categoria: formMov.categoria };
                    movimientosActualizados = [nuevoMov, ...movimientosActualizados];
                }

                actualizarYGuardar({ ...datos, cuentas: cuentasActualizadas, movimientos: movimientosActualizados });
                setModalVisible(null);
            };

            const eliminarMovimiento = (id) => {
                if (!confirm("¿Deseas eliminar este movimiento?")) return;
                const mov = datos.movimientos.find(m => m.id === id);
                if (!mov) return;
                const cuentasActualizadas = datos.cuentas.map(c => c.id === mov.cuentaId ? { ...c, saldo: mov.tipo === 'ingreso' ? c.saldo - mov.monto : c.saldo + mov.monto } : c);
                actualizarYGuardar({ ...datos, cuentas: cuentasActualizadas, movimientos: datos.movimientos.filter(m => m.id !== id) });
            };

            // Gestores de Bolsillos
            const guardarBolsillo = (e) => {
                e.preventDefault();
                const meta = parseFloat(formBolsillo.meta) || 0;
                const actual = parseFloat(formBolsillo.actual) || 0;
                let lista = [...datos.bolsillos];
                if (formBolsillo.id) {
                    lista = lista.map(b => b.id === formBolsillo.id ? { ...b, nombre: formBolsillo.nombre, meta, actual, cuentaId: formBolsillo.cuentaId } : b);
                } else {
                    lista.push({ id: 'b_' + Date.now(), nombre: formBolsillo.nombre, meta, actual, cuentaId: formBolsillo.cuentaId });
                }
                actualizarYGuardar({ ...datos, bolsillos: lista });
                setModalVisible(null);
            };

            const eliminarBolsillo = (id) => {
                if (!confirm("¿Eliminar este bolsillo?")) return;
                actualizarYGuardar({ ...datos, bolsillos: datos.bolsillos.filter(b => b.id !== id) });
            };

            // Gestores de Destinaciones
            const guardarDestinacion = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formDestino.monto) || 0;
                let lista = [...(datos.destinaciones || [])];
                if (formDestino.id) {
                    lista = lista.map(d => d.id === formDestino.id ? { ...d, nombre: formDestino.nombre, monto: montoNum, descripcion: formDestino.descripcion } : d);
                } else {
                    lista.push({ id: 'dest_' + Date.now(), nombre: formDestino.nombre, monto: montoNum, descripcion: formDestino.descripcion });
                }
                actualizarYGuardar({ ...datos, destinaciones: lista });
                setModalVisible(null);
            };

            const eliminarDestinacion = (id) => {
                if (!confirm("¿Eliminar esta destinación?")) return;
                actualizarYGuardar({ ...datos, destinaciones: (datos.destinaciones || []).filter(d => d.id !== id) });
            };

            // Gestores de Deudas
            const guardarDeuda = (e) => {
                e.preventDefault();
                const orig = parseFloat(formDeuda.montoOriginal) || 0;
                let lista = [...datos.deudas];
                if (formDeuda.id) {
                    lista = lista.map(d => d.id === formDeuda.id ? { ...d, entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaVencimiento: formDeuda.fechaVencimiento, fechaHora: formDeuda.fechaHora } : d);
                } else {
                    lista.push({ id: 'd_' + Date.now(), entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaVencimiento: formDeuda.fechaVencimiento, fechaHora: formDeuda.fechaHora || obtenerFechaHoraActual(), abonos: [] });
                }
                actualizarYGuardar({ ...datos, deudas: lista });
                setModalVisible(null);
            };

            const eliminarDeuda = (id) => {
                if (!confirm("¿Eliminar esta deuda?")) return;
                actualizarYGuardar({ ...datos, deudas: datos.deudas.filter(d => d.id !== id) });
            };

            const abonarDeuda = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formAbonoDeuda.monto);
                if (isNaN(montoNum) || montoNum <= 0) return alert("Monto inválido");

                const cuentasActualizadas = datos.cuentas.map(c => c.id === formAbonoDeuda.cuentaId ? { ...c, saldo: c.saldo - montoNum } : c);
                const deudasActualizadas = datos.deudas.map(d => {
                    if (d.id === formAbonoDeuda.deudaId) {
                        return { ...d, abonos: [...(d.abonos || []), { id: 'ab_' + Date.now(), monto: montoNum, fechaHora: formAbonoDeuda.fechaHora || obtenerFechaHoraActual(), cuentaId: formAbonoDeuda.cuentaId }] };
                    }
                    return d;
                });
                const nuevoMov = { id: 'm_' + Date.now(), fechaHora: formAbonoDeuda.fechaHora || obtenerFechaHoraActual(), concepto: `Abono a Deuda: ${datos.deudas.find(d => d.id === formAbonoDeuda.deudaId)?.entidad || ''}`, monto: montoNum, tipo: 'egreso', cuentaId: formAbonoDeuda.cuentaId, categoria: 'Pago de Deuda' };

                actualizarYGuardar({ ...datos, cuentas: cuentasActualizadas, deudas: deudasActualizadas, movimientos: [nuevoMov, ...datos.movimientos] });
                setModalVisible(null);
            };

            // Gestores de Por Cobrar
            const guardarPorCobrar = (e) => {
                e.preventDefault();
                const orig = parseFloat(formPorCobrar.montoOriginal) || 0;
                let lista = [...datos.porCobrar];
                if (formPorCobrar.id) {
                    lista = lista.map(r => r.id === formPorCobrar.id ? { ...r, deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig, fechaAcordada: formPorCobrar.fechaAcordada, fechaHora: formPorCobrar.fechaHora } : r);
                } else {
                    lista.push({ id: 'r_' + Date.now(), deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig, fechaAcordada: formPorCobrar.fechaAcordada, fechaHora: formPorCobrar.fechaHora || obtenerFechaHoraActual(), abonos: [] });
                }
                actualizarYGuardar({ ...datos, porCobrar: lista });
                setModalVisible(null);
            };

            const eliminarPorCobrar = (id) => {
                if (!confirm("¿Eliminar este registro?")) return;
                actualizarYGuardar({ ...datos, porCobrar: datos.porCobrar.filter(r => r.id !== id) });
            };

            const recibirAbonoCobro = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formAbonoCobro.monto);
                if (isNaN(montoNum) || montoNum <= 0) return alert("Monto inválido");

                const cuentasActualizadas = datos.cuentas.map(c => c.id === formAbonoCobro.cuentaId ? { ...c, saldo: c.saldo + montoNum } : c);
                const cobrosActualizados = datos.porCobrar.map(r => {
                    if (r.id === formAbonoCobro.cobroId) {
                        return { ...r, abonos: [...(r.abonos || []), { id: 'rab_' + Date.now(), monto: montoNum, fechaHora: formAbonoCobro.fechaHora || obtenerFechaHoraActual(), cuentaId: formAbonoCobro.cuentaId }] };
                    }
                    return r;
                });
                const nuevoMov = { id: 'm_' + Date.now(), fechaHora: formAbonoCobro.fechaHora || obtenerFechaHoraActual(), concepto: `Abono Recibido: ${datos.porCobrar.find(r => r.id === formAbonoCobro.cobroId)?.deudor || ''}`, monto: montoNum, tipo: 'ingreso', cuentaId: formAbonoCobro.cuentaId, categoria: 'Cobro de Préstamo' };

                actualizarYGuardar({ ...datos, cuentas: cuentasActualizadas, porCobrar: cobrosActualizados, movimientos: [nuevoMov, ...datos.movimientos] });
                setModalVisible(null);
            };

            // Gestor Cierre de Mes
            const realizarCierreMensual = (e) => {
                e.preventDefault();
                if (!nombreCierre.trim()) return alert("Ingresa un nombre para el mes (ej: Octubre 2026)");

                const registroCierre = {
                    id: 'cierre_' + Date.now(),
                    nombreMes: nombreCierre.trim(),
                    fechaCierre: obtenerFechaHoraActual(),
                    resumen: { ...totales }
                };

                const listaCierres = [registroCierre, ...(datos.cierresMensuales || [])];
                actualizarYGuardar({ ...datos, cierresMensuales: listaCierres });
                setNombreCierre('');
                setModalVisible(null);
                alert("✅ Cierre mensual guardado con éxito.");
            };

            const navegacion = [
                { id: 'inicio', etiqueta: '📊 Inicio' },
                { id: 'cuentas', etiqueta: '💳 Mis Cuentas' },
                { id: 'destinaciones', etiqueta: '🎯 Destinación de Fondos' },
                { id: 'bolsillos', etiqueta: '🐷 Bolsillos' },
                { id: 'deudas', etiqueta: '🔴 Mis Deudas' },
                { id: 'porCobrar', etiqueta: '🟢 Me Deben' },
                { id: 'movimientos', etiqueta: '📜 Movimientos' },
                { id: 'cierres', etiqueta: '🔒 Cierre de Mes' }
            ];

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-black text-neutral-100">
                    
                    {/* CABECERA (MÓVIL Y ESCRITORIO) */}
                    <header className="bg-neutral-950 border-b border-neutral-900 p-4 flex items-center justify-between sticky top-0 z-30">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setMenuMovilAbierto(!menuMovilAbierto)} className="md:hidden p-2 text-neutral-300 hover:text-white bg-neutral-900 rounded-lg border border-neutral-800">
                                {menuMovilAbierto ? '✕' : '☰'}
                            </button>
                            <div className="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center font-black text-neutral-950 text-lg shadow-md shadow-emerald-500/10">J</div>
                            <div>
                                <h1 className="font-bold text-white text-base leading-none">Mis Finanzas</h1>
                                <span className="text-[11px] text-emerald-400 font-semibold">Jose Pacheco</span>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            <span className={`text-[10px] font-bold px-2.5 py-1 rounded-full border ${estadoSincro === 'sincronizando' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : estadoSincro === 'exito' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' : 'bg-red-500/10 text-red-500 border-red-500/30'}`}>
                                {estadoSincro === 'sincronizando' ? '⏳ Sincronizando' : estadoSincro === 'exito' ? '⚡ En línea' : '❌ Error Nube'}
                            </span>
                            <button onClick={() => { setFormMov({ id: null, concepto: '', monto: '', cuentaId: 'c1', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() }); setModalVisible('movimiento'); }} className="bg-emerald-500 hover:bg-emerald-400 text-neutral-950 px-3.5 py-2 rounded-xl text-xs font-extrabold transition">
                                + Movimiento
                            </button>
                        </div>
                    </header>

                    {/* MENÚ DESPLEGABLE MÓVIL */}
                    {menuMovilAbierto && (
                        <div className="md:hidden bg-neutral-950 border-b border-neutral-900 p-4 space-y-2">
                            {navegacion.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => { setPestanaActiva(item.id); setMenuMovilAbierto(false); }}
                                    className={`w-full text-left px-4 py-3 rounded-xl text-sm font-bold transition ${
                                        pestanaActiva === item.id ? 'bg-neutral-900 text-emerald-400 border border-neutral-800' : 'text-neutral-400 hover:text-white'
                                    }`}
                                >
                                    {item.etiqueta}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* BARRA LATERAL (SOLO ESCRITORIO) */}
                    <aside className="hidden md:flex w-64 bg-neutral-950 border-r border-neutral-900 p-4 flex-col justify-between shrink-0">
                        <div className="space-y-1">
                            {navegacion.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setPestanaActiva(item.id)}
                                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition ${
                                        pestanaActiva === item.id ? 'bg-neutral-900 text-emerald-400 border border-neutral-800' : 'text-neutral-400 hover:bg-neutral-900 hover:text-white'
                                    }`}
                                >
                                    {item.etiqueta}
                                </button>
                            ))}
                        </div>

                        <div className="pt-4 border-t border-neutral-900">
                            <button onClick={cargarDesdeSupabase} className="w-full bg-neutral-900 hover:bg-neutral-800 text-neutral-300 text-xs font-bold py-2.5 rounded-xl border border-neutral-800 transition">
                                🔄 Sincronizar Ahora
                            </button>
                        </div>
                    </aside>

                    {/* CONTENIDO PRINCIPAL ADAPTABLE */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto max-w-5xl mx-auto w-full space-y-6">
                        
                        <div className="flex items-center justify-between border-b border-neutral-900 pb-3">
                            <h2 className="text-lg md:text-2xl font-black text-white uppercase tracking-wider">{navegacion.find(n => n.id === pestanaActiva)?.etiqueta}</h2>
                            <p className="text-xs text-neutral-500">Panel Financiero</p>
                        </div>

                        {/* INICIO / DASHBOARD */}
                        {pestanaActiva === 'inicio' && (
                            <div className="space-y-4 md:space-y-6">
                                <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-5 md:p-6">
