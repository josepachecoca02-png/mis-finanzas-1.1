<body class="bg-black text-neutral-100 min-h-screen pb-48 md:pb-6 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://qdwqxnuccqzmkzffqlun.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3raAVklcVTD0xtDGTPntHA_VrtJ9u_H";

        const PIN_EXACTO = "150624";
        const PIN_HASH_PREDETERMINADO = "01d36c1a84f5be6ad0cfbd45137eb152e724cf65c4cd98a6eb792fffa70b9ce4";

        const obtenerFechaHoraActual = () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            return ahora.toISOString().slice(0, 16);
        };

        const obtenerFechaHoy = () => new Date().toISOString().slice(0, 10);

        const hashPin = async (pin) => {
            const msgUint8 = new TextEncoder().encode(pin + "_salt_jose_finanzas");
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const CUENTAS_PREDETERMINADAS = [
            { id: "c1", nombre: "Daviplata", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c2", nombre: "Nequi", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c3", nombre: "Bancolombia", tipo: "Banco", saldo: 0, moneda: "COP", activa: true },
            { id: "c4", nombre: "Efectivo", tipo: "Efectivo", saldo: 0, moneda: "COP", activa: true },
            { id: "c5", nombre: "Binance", tipo: "Inversión", saldo: 500, saldoCOP: 0, moneda: "USD", activa: true },
            { id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true }
        ];

        const ESTADO_INICIAL = {
            pinHash: PIN_HASH_PREDETERMINADO,
            cuentas: CUENTAS_PREDETERMINADAS,
            deudas: [],
            porCobrar: [],
            movimientos: [],
            destinaciones: [],
            cierresMensuales: [],
            trades: [],
            cierresInversion: [],
            holdings: [],
            cierresHolding: [],
            predicciones: [],
            cierresPredicciones: []
        };

        function Aplicacion() {
            const [datos, setDatos] = useState(() => {
                try {
                    const guardado = localStorage.getItem('mis_finanzas_jose_v29');
                    if (guardado) {
                        const parsed = JSON.parse(guardado);
                        if (!parsed.cuentas || parsed.cuentas.length === 0) parsed.cuentas = CUENTAS_PREDETERMINADAS;
                        
                        let c6Existe = parsed.cuentas.find(c => c.id === 'c6');
                        if (!c6Existe) {
                            parsed.cuentas.push({ id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true });
                        } else if (c6Existe.moneda !== 'USD') {
                            parsed.cuentas = parsed.cuentas.map(c => c.id === 'c6' ? { ...c, moneda: 'USD', saldoCOP: 0 } : c);
                        }

                        parsed.pinHash = PIN_HASH_PREDETERMINADO;
                        if (!parsed.trades) parsed.trades = [];
                        if (!parsed.cierresInversion) parsed.cierresInversion = [];
                        if (!parsed.holdings) parsed.holdings = [];
                        if (!parsed.cierresHolding) parsed.cierresHolding = [];
                        if (!parsed.predicciones) parsed.predicciones = [];
                        if (!parsed.cierresPredicciones) parsed.cierresPredicciones = [];
                        return parsed;
                    }
                    return ESTADO_INICIAL;
                } catch(e) { return ESTADO_INICIAL; }
            });

            const [autenticado, setAutenticado] = useState(() => localStorage.getItem('mis_finanzas_sesion_activa') === 'true');
            const [inputPin, setInputPin] = useState('');
            const [recordarDispositivo, setRecordarDispositivo] = useState(true);
            const [errorPin, setErrorPin] = useState('');
            const [ocultarSaldos, setOcultarSaldos] = useState(false);
            const [menuAdminAbierto, setMenuAdminAbierto] = useState(false);
            const [estadoSincro, setEstadoSincro] = useState('espera');
            const [rubroActivo, setRubroActivo] = useState('inicio');
            const [subRubroTrade, setSubRubroTrade] = useState('scalping');
            
            const [modalVisible, setModalVisible] = useState(null);
            const [confirmacion, setConfirmacion] = useState(null);
            const [notificacion, setNotificacion] = useState(null);

            const [busquedaMov, setBusquedaMov] = useState('');
            const [filtroCuentaMov, setFiltroCuentaMov] = useState('todas');

            const clienteSupabase = useRef(null);
            const inputFileRef = useRef(null);

            const mostrarNotificacion = (mensaje, tipo = 'exito') => {
                setNotificacion({ mensaje, tipo });
                setTimeout(() => setNotificacion(null), 3000);
            };

            const pedirConfirmacion = ({ titulo, mensaje, accion }) => setConfirmacion({ titulo, mensaje, accion });
            const cambiarRubro = (nuevoRubro) => { setBusquedaMov(''); setRubroActivo(nuevoRubro); };

            useEffect(() => {
                try {
                    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                        clienteSupabase.current = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        cargarDesdeSupabase();
                    } else { setEstadoSincro('error'); }
                } catch(e) { setEstadoSincro('error'); }
            }, []);

            useEffect(() => {
                try { localStorage.setItem('mis_finanzas_jose_v29', JSON.stringify(datos)); } catch(e) {}
            }, [datos]);

            const cargarDesdeSupabase = async () => {
                if (!clienteSupabase.current) return;
                setEstadoSincro('sincronizando');
                try {
                    const { data: respuesta, error } = await clienteSupabase.current.from('app_data').select('content').eq('id', 'jose_finanzas').single();
                    if (error && error.code !== 'PGRST116') { setEstadoSincro('error'); return; }
                    
                    if (respuesta && respuesta.content && typeof respuesta.content === 'object') {
                        const remoto = respuesta.content;
                        if (!remoto.cuentas || remoto.cuentas.length === 0) remoto.cuentas = CUENTAS_PREDETERMINADAS;
                        
                        let c6Existe = remoto.cuentas.find(c => c.id === 'c6');
                        if (!c6Existe) {
                            remoto.cuentas.push({ id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true });
                        } else if (c6Existe.moneda !== 'USD') {
                            remoto.cuentas = remoto.cuentas.map(c => c.id === 'c6' ? { ...c, moneda: 'USD', saldoCOP: 0 } : c);
                        }

                        remoto.pinHash = PIN_HASH_PREDETERMINADO;
                        if (!remoto.trades) remoto.trades = [];
                        if (!remoto.cierresInversion) remoto.cierresInversion = [];
                        if (!remoto.holdings) remoto.holdings = [];
                        if (!remoto.cierresHolding) remoto.cierresHolding = [];
                        if (!remoto.predicciones) remoto.predicciones = [];
                        if (!remoto.cierresPredicciones) remoto.cierresPredicciones = [];
                        setDatos(remoto);
                        setEstadoSincro('exito');
                    } else { guardarEnSupabase(datos); }
                } catch(err) { setEstadoSincro('error'); }
            };

            const guardarEnSupabase = async (nuevosDatos) => {
                if (!clienteSupabase.current) return;
                setEstadoSincro('sincronizando');
                try {
                    const { error } = await clienteSupabase.current.from('app_data').upsert({ id: 'jose_finanzas', content: nuevosDatos, updated_at: new Date() });
                    if (!error) setEstadoSincro('exito'); else setEstadoSincro('error');
                } catch(err) { setEstadoSincro('error'); }
            };

            const actualizarYGuardar = (nuevosDatos) => {
                const datosAjustados = { ...nuevosDatos, pinHash: PIN_HASH_PREDETERMINADO };
                setDatos(datosAjustados);
                guardarEnSupabase(datosAjustados);
            };

            const manejarVerificacionPin = async (e) => {
                e.preventDefault();
                const h = await hashPin(inputPin);
                if (inputPin === PIN_EXACTO || h === PIN_HASH_PREDETERMINADO) {
                    setAutenticado(true);
                    setErrorPin('');
                    if (recordarDispositivo) localStorage.setItem('mis_finanzas_sesion_activa', 'true');
                    else localStorage.removeItem('mis_finanzas_sesion_activa');
                } else {
                    setErrorPin('❌ PIN incorrecto');
                    setInputPin('');
                }
            };

            const bloquearSesion = () => {
                setAutenticado(false);
                setInputPin('');
                localStorage.removeItem('mis_finanzas_sesion_activa');
                mostrarNotificacion("🔒 Sesión bloqueada");
            };

            const formatearMoneda = (valor, moneda = 'COP') => {
                if (ocultarSaldos) return '••••••';
                if (moneda === 'USD') return '$' + (valor || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
                return '$' + (valor || 0).toLocaleString('es-CO') + ' COP';
            };

            const formatearFechaHora = (cadenaFecha) => {
                if (!cadenaFecha) return '';
                return new Date(cadenaFecha).toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const listaCuentas = useMemo(() => (datos?.cuentas && datos.cuentas.length > 0) ? datos.cuentas : CUENTAS_PREDETERMINADAS, [datos]);

            const totales = useMemo(() => {
                const cuentas = listaCuentas;
                const destinaciones = datos?.destinaciones || [];
                const porCobrarLista = datos?.porCobrar || [];
                const deudasLista = datos?.deudas || [];

                const saldoBrutoCOP = cuentas.reduce((acc, c) => {
                    if (c.activa === false) return acc;
                    if (c.moneda === 'USD' || c.tipo === 'Inversión') return acc + (c.saldoCOP || 0);
                    return acc + c.saldo;
                }, 0);

                const capScalpingUSD = cuentas.find(c => c.id === 'c5')?.saldo || 0;
                const capPredUSD = cuentas.find(c => c.id === 'c6')?.saldo || 0;
                const holdingActivoUSD = (datos?.holdings || []).filter(h => !h.cerrado).reduce((acc, h) => acc + (parseFloat(h.montoUSD) || 0), 0);

                const totalDestinado = destinaciones.reduce((acc, d) => acc + (d.monto || 0), 0);
                const disponibleRealCOP = Math.max(0, saldoBrutoCOP - totalDestinado);

                const porCobrar = porCobrarLista.reduce((acc, r) => acc + Math.max(0, r.montoOriginal - ((r.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const deudas = deudasLista.reduce((acc, d) => acc + Math.max(0, d.montoOriginal - ((d.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const patrimonioNetoCOP = disponibleRealCOP + totalDestinado + porCobrar - deudas;

                return { saldoBrutoCOP, totalDestinado, disponibleRealCOP, capScalpingUSD, capPredUSD, holdingActivoUSD, porCobrar, deudas, patrimonioNetoCOP };
            }, [datos, listaCuentas]);

            const [formMov, setFormMov] = useState({ id: null, concepto: '', monto: '', cuentaId: 'c1', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() });
            const [formTransfer, setFormTransfer] = useState({ cuentaOrigenId: 'c3', cuentaDestinoId: 'c2', monto: '', concepto: 'Transferencia propia', fechaHora: obtenerFechaHoraActual() });
            const [formAjusteSaldo, setFormAjusteSaldo] = useState({ cuentaId: 'c1', nuevoSaldo: '', nota: '', fechaHora: obtenerFechaHoraActual() });
            const [formDestino, setFormDestino] = useState({ id: null, nombre: '', monto: '', descripcion: '' });
            const [formEjecutarDestino, setFormEjecutarDestino] = useState({ destinacionId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formDeuda, setFormDeuda] = useState({ id: null, entidad: '', concepto: '', montoOriginal: '', fechaVencimiento: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoDeuda, setFormAbonoDeuda] = useState({ deudaId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formPorCobrar, setFormPorCobrar] = useState({ id: null, deudor: '', concepto: '', montoOriginal: '', fechaAcordada: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoCobro, setFormAbonoCobro] = useState({ cobroId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });

            const [formTrade, setFormTrade] = useState({ id: null, par: 'BTC/USDT', resultado: 'gain', montoUSD: '', estrategia: '', fechaHora: obtenerFechaHoraActual() });
            const [formCierreInv, setFormCierreInv] = useState({ tipo: 'semanal', nombre: '', tasaTRM: '3950' });
            const [formTransferUtilidad, setFormTransferUtilidad] = useState({ cuentaDestinoId: 'c2', montoCOP: '', fechaHora: obtenerFechaHoraActual() });

            const [formHoldingEntrada, setFormHoldingEntrada] = useState({ id: null, activo: 'BTC', montoUSD: '', trmEntrada: '3950', fechaHora: obtenerFechaHoraActual() });
            const [formHoldingSalida, setFormHoldingSalida] = useState({ holdingId: '', montoUSDSalida: '', trmSalida: '4000', cuentaDestinoId: 'c3', fechaHora: obtenerFechaHoraActual() });

            const [formPrediccion, setFormPrediccion] = useState({ id: null, activo: 'BTC/USDT', direccion: 'sube', montoInvertidoUSD: '', resultado: 'pendiente', montoRetornadoUSD: '', cuentaId: 'c6', fechaHora: obtenerFechaHoraActual() });
            const [formCierrePred, setFormCierrePred] = useState({ tipo: 'semanal', nombre: '', tasaTRM: '3950' });

            const [formAnularCierre, setFormAnularCierre] = useState({ id: '', tipo: '', razon: '' });
            const [formEditCierre, setFormEditCierre] = useState({ id: '', tipo: '', nombre: '', tasaTRM: '' });
            const [formResolverPred, setFormResolverPred] = useState({ id: '', montoRetornadoUSD: '' });

            const metricasScalping = useMemo(() => {
                const tradesActivos = (datos?.trades || []).filter(t => !t.cerrado);
                const gains = tradesActivos.filter(t => t.resultado === 'gain');
                const losses = tradesActivos.filter(t => t.resultado === 'loss');
                const totalGainsUSD = gains.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const totalLossesUSD = losses.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const pnlNetoUSD = totalGainsUSD - totalLossesUSD;
                const winRate = tradesActivos.length > 0 ? ((gains.length / tradesActivos.length) * 100).toFixed(1) : '0.0';
                const avgGain = gains.length > 0 ? totalGainsUSD / gains.length : 0;
                const avgLoss = losses.length > 0 ? totalLossesUSD / losses.length : 0;
                const ratioRR = avgLoss > 0 ? (avgGain / avgLoss).toFixed(2) : (avgGain > 0 ? '∞' : '0.00');
                return { totalTrades: tradesActivos.length, winRate, avgGain, avgLoss, ratioRR, pnlNetoUSD };
            }, [datos.trades]);

            const metricasHolding = useMemo(() => {
                const hCerrados = datos?.cierresHolding || [];
                const ganancias = hCerrados.filter(h => h.gananciaNetaCOP > 0);
                const winRate = hCerrados.length > 0 ? ((ganancias.length / hCerrados.length) * 100).toFixed(1) : '0.0';
                const pnlTotalCOP = hCerrados.reduce((acc, h) => acc + (h.gananciaNetaCOP || 0), 0);
                const pnlTotalUSD = hCerrados.reduce((acc, h) => acc + (h.gananciaUSD || 0), 0);
                return { winRate, pnlTotalCOP, pnlTotalUSD };
            }, [datos.cierresHolding]);

            const metricasPredicciones = useMemo(() => {
                const predsActivas = (datos?.predicciones || []).filter(p => !p.cerrado);
                const resueltas = predsActivas.filter(p => p.resultado !== 'pendiente');
                const aciertos = resueltas.filter(p => p.resultado === 'acertada');
                const winRate = resueltas.length > 0 ? ((aciertos.length / resueltas.length) * 100).toFixed(1) : '0.0';
                const pnlNetoUSD = resueltas.reduce((acc, p) => {
                    if (p.resultado === 'acertada') return acc + (parseFloat(p.montoRetornadoUSD || 0) - parseFloat(p.montoInvertidoUSD || 0));
                    return acc - parseFloat(p.montoInvertidoUSD || 0);
                }, 0);
                return { total: predsActivas.length, winRate, aciertosCount: aciertos.length, fallidasCount: resueltas.length - aciertos.length, pnlNetoUSD };
            }, [datos.predicciones]);

            const exportarBackupJSON = () => {
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(datos, null, 2))}`;
                const a = document.createElement('a');
                a.href = jsonString;
                a.download = `Mis_Finanzas_Jose_Backup_${obtenerFechaHoy()}.json`;
                a.click();
                mostrarNotificacion("💾 Backup completo exportado (.json)");
            };

            const importarBackupJSON = (e) => {
                const fr = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fr.readAsText(e.target.files[0], "UTF-8");
                    fr.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed && typeof parsed === 'object') {
                                pedirConfirmacion({
                                    titulo: "📥 Importar Copia de Seguridad",
                                    mensaje: "Esta acción reemplazará los datos actuales. ¿Deseas continuar?",
                                    accion: () => { actualizarYGuardar(parsed); mostrarNotificacion("✅ Copia de seguridad cargada con éxito"); }
                                });
                            }
                        } catch (err) { mostrarNotificacion("Archivo inválido", 'error'); }
                    };
                }
            };

            const abrirAnularCierre = (id, tipo) => {
                setFormAnularCierre({ id, tipo, razon: '' });
                setModalVisible('anularCierre');
            };

            const procesarAnulacionCierre = (e) => {
                e.preventDefault();
                const { id, tipo, razon } = formAnularCierre;
                if (!razon.trim()) return mostrarNotificacion("Debes ingresar un motivo", 'error');

                if (tipo === 'scalping') {
                    const c = (datos.cierresInversion || []).find(x => x.id === id);
                    if (!c) return;
                    const cuentasAct = listaCuentas.map(cta => cta.id === 'c5' ? { ...cta, saldoCOP: Math.max(0, (cta.saldoCOP || 0) - c.totalCOP) } : cta);
                    const nuevoMov = { id: 'm_dcinv_' + Date.now(), fechaHora: obtenerFechaHoraActual(), concepto: `🗑️ Anulación Cierre Scalping: ${c.nombre} (${razon})`, monto: c.totalCOP, tipo: 'egreso', cuentaId: 'c5', categoria: 'Ajuste' };
                    actualizarYGuardar({ ...datos, cuentas: cuentasAct, cierresInversion: datos.cierresInversion.filter(x => x.id !== id), movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                } else if (tipo === 'predicciones') {
                    const c = (datos.cierresPredicciones || []).find(x => x.id === id);
                    if (!c) return;
                    const cuentasAct = listaCuentas.map(cta => cta.id === 'c6' ? { ...cta, saldoCOP: Math.max(0, (cta.saldoCOP || 0) - c.totalCOP) } : cta);
                    const nuevoMov = { id: 'm_dcpred_' + Date.now(), fechaHora: obtenerFechaHoraActual(), concepto: `🗑️ Anulación Cierre Predicciones: ${c.nombre} (${razon})`, monto: c.totalCOP, tipo: 'egreso', cuentaId: 'c6', categoria: 'Ajuste' };
                    actualizarYGuardar({ ...datos, cuentas: cuentasAct, cierresPredicciones: datos.cierresPredicciones.filter(x => x.id !== id), movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                } else if (tipo === 'holding') {
                    const c = (datos.cierresHolding || []).find(x => x.id === id);
                    if (!c) return;
                    const nuevoMov = { id: 'm_dchold_' + Date.now(), fechaHora: obtenerFechaHoraActual(), concepto: `🗑️ Anulación Cierre Holding: ${c.activo} (${razon})`, monto: c.gananciaNetaCOP, tipo: 'egreso', cuentaId: 'c1', categoria: 'Ajuste' };
                    actualizarYGuardar({ ...datos, cierresHolding: datos.cierresHolding.filter(x => x.id !== id), movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                }
                
                setModalVisible(null);
                mostrarNotificacion("🗑️ Liquidación anulada con éxito");
            };

            const abrirEditarCierre = (c, tipo) => {
                setFormEditCierre({ id: c.id, tipo, nombre: c.nombre || c.activo, tasaTRM: c.tasaTRM || c.trmSalida });
                setModalVisible('editarCierre');
            };

            const procesarEdicionCierre = (e) => {
                e.preventDefault();
                const { id, tipo, nombre, tasaTRM } = formEditCierre;
                const trmNum = parseFloat(tasaTRM);
                if (isNaN(trmNum) || trmNum <= 0) return mostrarNotificacion("TRM inválida", 'error');

                if (tipo === 'scalping') {
                    const c = (datos.cierresInversion || []).find(x => x.id === id);
                    if(!c) return;
                    const nuevoTotalCOP = c.gananciaUSD * trmNum;
                    const deltaCOP = nuevoTotalCOP - c.totalCOP;
                    const cuentasAct = listaCuentas.map(cta => cta.id === 'c5' ? { ...cta, saldoCOP: Math.max(0, (cta.saldoCOP || 0) + deltaCOP) } : cta);
                    const cierresAct = datos.cierresInversion.map(x => x.id === id ? { ...x, nombre, tasaTRM: trmNum, totalCOP: nuevoTotalCOP } : x);

                        actualizarYGuardar({ ...datos, cuentas: cuentasAct, movimientos: datos.movimientos.filter(x => x.id !== id) });
                        mostrarNotificacion("🗑️ Movimiento eliminado");
                    }

            const guardarDestinacion = (e) => {
                e.preventDefault();
                const monto = parseFloat(formDestino.monto) || 0;
                let lista = [...(datos.destinaciones || [])];

                mostrarNotificacion("✅ Destinación guardada");

            const ejecutarPagoDestinacion = (e) => {
                e.preventDefault();
                const monto = parseFloat(formEjecutarDestino.monto);
                const dest = (datos.destinaciones || []).find(d => d.id === formEjecutarDestino.destinacionId);
                if (!dest || isNaN(monto)) return;

                const cuentasAct = listaCuentas.map(c => c.id === formEjecutarDestino.cuentaId ? { ...c, saldo: c.saldo - monto } : c);
                const nuevoMov = { id: 'm_dp_' + Date.now(), fechaHora: formEjecutarDestino.fechaHora, concepto: `🎯 Gasto Destinado: ${dest.nombre}`, monto, tipo: 'egreso', cuentaId: formEjecutarDestino.cuentaId };
                const destAct = monto >= dest.monto ? (datos.destinaciones || []).filter(d => d.id !== formEjecutarDestino.destinacionId) : (datos.destinaciones || []).map(d => d.id === formEjecutarDestino.destinacionId ? { ...d, monto: d.monto - monto } : d);

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, destinaciones: destAct, movimientos: [nuevoMov, ...(datos.movimientos || [])] });

                setModalVisible(null);

            const eliminarDestinacion = (id) => {
                pedirConfirmacion({ titulo: "🗑️ Eliminar Destinación", mensaje: "¿Deseas eliminar este fondo reservado?", accion: () => { actualizarYGuardar({ ...datos, destinaciones: (datos.destinaciones || []).filter(d => d.id !== id) }); mostrarNotificacion("🗑️ Eliminada"); } });
            };

            const guardarDeuda = (e) => {
                e.preventDefault();
                const orig = parseFloat(formDeuda.montoOriginal) || 0;
                let lista = [...(datos.deudas || [])];
                if (formDeuda.id) {
                    lista = lista.map(d => d.id === formDeuda.id ? { ...d, entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaVencimiento: formDeuda.fechaVencimiento, fechaHora: formDeuda.fechaHora } : d);
                } else {
                    lista.push({ id: 'd_' + Date.now(), entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaVencimiento: formDeuda.fechaVencimiento, fechaHora: formDeuda.fechaHora, abonos: [] });

                actualizarYGuardar({ ...datos, deudas: lista });

            const abonarDeuda = (e) => {

                const deudasAct = (datos.deudas || []).map(d => d.id === formAbonoDeuda.deudaId ? { ...d, abonos: [...(d.abonos || []), { id: 'ab_' + Date.now(), monto, fechaHora: formAbonoDeuda.fechaHora, cuentaId: formAbonoDeuda.cuentaId }] } : d);
                const nuevoMov = { id: 'm_ad_' + Date.now(), fechaHora: formAbonoDeuda.fechaHora, concepto: `Abono Deuda`, monto, tipo: 'egreso', cuentaId: formAbonoDeuda.cuentaId };

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, deudas: deudasAct, movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                setFormAbonoDeuda({ deudaId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
                setModalVisible(null);
                mostrarNotificacion("✅ Abono registrado");

            const guardarPorCobrar = (e) => {
                e.preventDefault();

                    lista = lista.map(r => r.id === formPorCobrar.id ? { ...r, deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig, fechaAcordada: formPorCobrar.fechaAcordada, fechaHora: formPorCobrar.fechaHora } : r);
                } else {
                    lista.push({ id: 'r_' + Date.now(), deudor: formPorCobrar.deudor, concepto: formPorCobrar.concepto, montoOriginal: orig, fechaAcordada: formPorCobrar.fechaAcordada, fechaHora: formPorCobrar.fechaHora, abonos: [] });

                e.preventDefault();

                const nuevoMov = { id: 'm_rc_' + Date.now(), fechaHora: formAbonoCobro.fechaHora, concepto: `Abono Recibido`, monto, tipo: 'ingreso', cuentaId: formAbonoCobro.cuentaId };

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, porCobrar: cobrosAct, movimientos: [nuevoMov, ...(datos.movimientos || [])] });
                setFormAbonoCobro({ cobroId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
                setModalVisible(null);
                mostrarNotificacion("✅ Cobro registrado");

            const eliminarPorCobrar = (id) => {
                pedirConfirmacion({ titulo: "🗑️ Eliminar Préstamo", mensaje: "¿Eliminar este cobro?", accion: () => { actualizarYGuardar({ ...datos, porCobrar: (datos.porCobrar || []).filter(r => r.id !== id) }); mostrarNotificacion("🗑️ Eliminado"); } });
            };

            const movimientosFiltrados = useMemo(() => {
                let lista = datos.movimientos || [];
                if (filtroCuentaMov !== 'todas') lista = lista.filter(m => m.cuentaId === filtroCuentaMov);
                if (busquedaMov.trim()) lista = lista.filter(m => m.concepto.toLowerCase().includes(busquedaMov.toLowerCase()));
                return lista;
            }, [datos.movimientos, busquedaMov, filtroCuentaMov]);

            const calcularAlertaVencimiento = (fechaVenc) => {
                if (!fechaVenc) return null;
                const hoy = new Date(); hoy.setHours(0,0,0,0);
                const venc = new Date(fechaVenc); venc.setHours(0,0,0,0);
                const diffDays = Math.ceil((venc - hoy) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return { texto: '🚨 Vencido', clase: 'bg-red-500/20 text-red-400 border-red-500/30', dias: diffDays };
                if (diffDays === 0) return { texto: '⚠️ Vence Hoy', clase: 'bg-amber-500/20 text-amber-400 border-amber-500/30', dias: 0 };
                if (diffDays <= 3) return { texto: `⚠️ Vence en ${diffDays} días`, clase: 'bg-amber-500/20 text-amber-400 border-amber-500/30', dias: diffDays };
                return null;
            };

            const proximosVencimientos = useMemo(() => {
                const deudas = (datos?.deudas || []).map(d => {
                    const tot = (d.abonos || []).reduce((a, b) => a + b.monto, 0);

                    const al = calcularAlertaVencimiento(d.fechaVencimiento);
                    return (pend > 0 && al) ? { ...d, tipoItem: 'deuda', pendiente: pend, alerta: al } : null;
                }).filter(Boolean);

                const cobros = (datos?.porCobrar || []).map(r => {
                    const tot = (r.abonos || []).reduce((a, b) => a + b.monto, 0);
                    const pend = Math.max(0, r.montoOriginal - tot);
                    const al = calcularAlertaVencimiento(r.fechaAcordada);
                    return (pend > 0 && al) ? { ...r, tipoItem: 'cobro', pendiente: pend, alerta: al } : null;
                }).filter(Boolean);

                return [...deudas, ...cobros].sort((a, b) => a.alerta.dias - b.alerta.dias);

            const rubros = [

                            <label className="flex items-center justify-center gap-2 text-xs text-neutral-400 cursor-pointer">
                                <input type="checkbox" checked={recordarDispositivo} onChange={e => setRecordarDispositivo(e.target.checked)} className="rounded bg-black border-neutral-800 text-emerald-500 focus:ring-0" /> Recordar este dispositivo
                            </label>
                            <button type="submit" className="w-full bg-emerald-500 hover:bg-emerald-400 text-neutral-950 font-extrabold py-3.5 rounded-2xl transition">Desbloquear</button>
                        </form>
                    </div>
                );

                                <div className="text-2xl font-bold text-white">{confirmacion.titulo}</div>
                                <p className="text-xs text-neutral-300 leading-relaxed">{confirmacion.mensaje}</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setConfirmacion(null)} className="w-1/2 bg-neutral-800 text-neutral-300 py-3 rounded-xl font-bold text-xs">Cancelar</button>
                                    <button onClick={() => { confirmacion.accion(); setConfirmacion(null); }} className="w-1/2 bg-red-600 text-white py-3 rounded-xl font-extrabold text-xs">Confirmar</button>

                                    {menuAdminAbierto && (
