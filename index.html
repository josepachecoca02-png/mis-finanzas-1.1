</head>
<body class="bg-black text-neutral-100 min-h-screen pb-48 md:pb-6 select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const SUPABASE_URL = "https://qdwqxnuccqzmkzffqlun.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_3raAVklcVTD0xtDGTPntHA_VrtJ9u_H";

        const PIN_EXACTO = "150624";
        const PIN_HASH_PREDETERMINADO = "01d36c1a84f5be6ad0cfbd45137eb152e724cf65c4cd98a6eb792fffa70b9ce4";

        const obtenerFechaHoraActual = () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            return ahora.toISOString().slice(0, 16);
        };

        const obtenerFechaHoy = () => new Date().toISOString().slice(0, 10);

        const hashPin = async (pin) => {
            const msgUint8 = new TextEncoder().encode(pin + "_salt_jose_finanzas");
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const CUENTAS_PREDETERMINADAS = [
            { id: "c1", nombre: "Daviplata", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c2", nombre: "Nequi", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c3", nombre: "Bancolombia", tipo: "Banco", saldo: 0, moneda: "COP", activa: true },
            { id: "c4", nombre: "Efectivo", tipo: "Efectivo", saldo: 0, moneda: "COP", activa: true },
            { id: "c5", nombre: "Binance (Scalping)", tipo: "Inversión", saldo: 500, saldoCOP: 0, moneda: "USD", activa: true },
            { id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true }
        ];

        const ESTADO_INICIAL = {
            pinHash: PIN_HASH_PREDETERMINADO,
            cuentas: CUENTAS_PREDETERMINADAS,
            deudas: [],
            porCobrar: [],
            movimientos: [],
            destinaciones: [],
            cierresMensuales: [],
            trades: [],
            cierresInversion: [],
            holdings: [],
            cierresHolding: [],
            predicciones: [],
            cierresPredicciones: []
        };

        function Aplicacion() {
            const [datos, setDatos] = useState(() => {
                try {
                    const guardado = localStorage.getItem('mis_finanzas_jose_v26');
                    if (guardado) {
                        const parsed = JSON.parse(guardado);
                        if (!parsed.cuentas || parsed.cuentas.length === 0) parsed.cuentas = CUENTAS_PREDETERMINADAS;
                        if (!parsed.cuentas.some(c => c.id === 'c6')) {
                            parsed.cuentas.push({ id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true });
                        }
                        parsed.pinHash = PIN_HASH_PREDETERMINADO;
                        if (!parsed.trades) parsed.trades = [];
                        if (!parsed.cierresInversion) parsed.cierresInversion = [];
                        if (!parsed.holdings) parsed.holdings = [];
                        if (!parsed.cierresHolding) parsed.cierresHolding = [];
                        if (!parsed.predicciones) parsed.predicciones = [];
                        if (!parsed.cierresPredicciones) parsed.cierresPredicciones = [];
                        return parsed;
                    }
                    return ESTADO_INICIAL;
                } catch(e) { return ESTADO_INICIAL; }
            });

            const [autenticado, setAutenticado] = useState(() => localStorage.getItem('mis_finanzas_sesion_activa') === 'true');
            const [inputPin, setInputPin] = useState('');
            const [recordarDispositivo, setRecordarDispositivo] = useState(true);
            const [errorPin, setErrorPin] = useState('');
            const [ocultarSaldos, setOcultarSaldos] = useState(false);
            const [menuAdminAbierto, setMenuAdminAbierto] = useState(false);

            const [rubroActivo, setRubroActivo] = useState('inicio');
            const [subRubroTrade, setSubRubroTrade] = useState('scalping');
            
            const [modalVisible, setModalVisible] = useState(null);
            const [confirmacion, setConfirmacion] = useState(null);
            const [notificacion, setNotificacion] = useState(null);

            const [busquedaMov, setBusquedaMov] = useState('');
            const [filtroFechaMov, setFiltroFechaMov] = useState('todos');
            const [filtroCuentaMov, setFiltroCuentaMov] = useState('todas');

            const clienteSupabase = useRef(null);
            const inputFileRef = useRef(null);

            const mostrarNotificacion = (mensaje, tipo = 'exito') => {
                setNotificacion({ mensaje, tipo });
                setTimeout(() => setNotificacion(null), 3000);
            };

            const pedirConfirmacion = ({ titulo, mensaje, accion }) => setConfirmacion({ titulo, mensaje, accion });
            const cambiarRubro = (nuevoRubro) => { setBusquedaMov(''); setRubroActivo(nuevoRubro); };

            useEffect(() => {
                try {
                    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                        clienteSupabase.current = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        cargarDesdeSupabase();
                    }
                } catch(e) {}
            }, []);

            useEffect(() => {
                try { localStorage.setItem('mis_finanzas_jose_v26', JSON.stringify(datos)); } catch(e) {}
            }, [datos]);

            const cargarDesdeSupabase = async () => {
                if (!clienteSupabase.current) return;
                try {
                    const { data: respuesta, error } = await clienteSupabase.current.from('app_data').select('content').eq('id', 'jose_finanzas').single();
                    if (respuesta && respuesta.content) {
                        const remoto = respuesta.content;
                        if (!remoto.cuentas || remoto.cuentas.length === 0) remoto.cuentas = CUENTAS_PREDETERMINADAS;
                        if (!remoto.cuentas.some(c => c.id === 'c6')) {
                            remoto.cuentas.push({ id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 100, saldoCOP: 0, moneda: "USD", activa: true });
                        }
                        remoto.pinHash = PIN_HASH_PREDETERMINADO;
                        if (!remoto.trades) remoto.trades = [];
                        if (!remoto.cierresInversion) remoto.cierresInversion = [];
                        if (!remoto.holdings) remoto.holdings = [];
                        if (!remoto.cierresHolding) remoto.cierresHolding = [];
                        if (!remoto.predicciones) remoto.predicciones = [];
                        if (!remoto.cierresPredicciones) remoto.cierresPredicciones = [];
                        setDatos(remoto);
                    } else {
                        guardarEnSupabase(datos);
                    }
                } catch(err) {}
            };

            const guardarEnSupabase = async (nuevosDatos) => {
                if (!clienteSupabase.current) return;
                try {
                    await clienteSupabase.current.from('app_data').upsert({ id: 'jose_finanzas', content: nuevosDatos, updated_at: new Date() });
                } catch(err) {}
            };

            const actualizarYGuardar = (nuevosDatos) => {
                const datosAjustados = { ...nuevosDatos, pinHash: PIN_HASH_PREDETERMINADO };
                setDatos(datosAjustados);
                guardarEnSupabase(datosAjustados);
            };

            const manejarVerificacionPin = async (e) => {
                e.preventDefault();
                const h = await hashPin(inputPin);
                if (inputPin === PIN_EXACTO || h === PIN_HASH_PREDETERMINADO) {
                    setAutenticado(true);
                    setErrorPin('');
                    if (recordarDispositivo) localStorage.setItem('mis_finanzas_sesion_activa', 'true');
                } else {
                    setErrorPin('❌ PIN incorrecto');
                    setInputPin('');
                }
            };

            const bloquearSesion = () => {
                setAutenticado(false);
                setInputPin('');
                localStorage.removeItem('mis_finanzas_sesion_activa');
                mostrarNotificacion("🔒 Sesión bloqueada");
            };

            const formatearMoneda = (valor, moneda = 'COP') => {
                if (ocultarSaldos) return '••••••';
                if (moneda === 'USD') return '$' + (valor || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
                return '$' + (valor || 0).toLocaleString('es-CO') + ' COP';
            };

            const formatearFechaHora = (cadenaFecha) => {
                if (!cadenaFecha) return '';
                return new Date(cadenaFecha).toLocaleString('es-CO', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const listaCuentas = useMemo(() => (datos?.cuentas && datos.cuentas.length > 0) ? datos.cuentas : CUENTAS_PREDETERMINADAS, [datos]);

            const totales = useMemo(() => {
                const cuentas = listaCuentas;
                const destinaciones = datos?.destinaciones || [];
                const porCobrarLista = datos?.porCobrar || [];
                const deudasLista = datos?.deudas || [];

                const saldoBrutoCOP = cuentas.reduce((acc, c) => {
                    if (c.activa === false) return acc;
                    if (c.moneda === 'USD' || c.tipo === 'Inversión') return acc + (c.saldoCOP || 0);
                    return acc + c.saldo;
                }, 0);

                // Capital Scalping (USD) convertido a COP estimado o sumado en bruto para patrimonio
                const cScalping = cuentas.find(c => c.id === 'c5');
                const cPred = cuentas.find(c => c.id === 'c6');
                const trmBase = 3950; // TRM estimada de referencia para patrimonio neto en USD si no está liquidado

                const capScalpingUSD = cScalping ? (cScalping.saldo || 0) : 0;
                const capPredUSD = cPred ? (cPred.saldo || 0) : 0;
                const holdingActivoUSD = (datos?.holdings || []).filter(h => !h.cerrado).reduce((acc, h) => acc + (parseFloat(h.montoUSD) || 0), 0);

                const totalInversionesUSD = capScalpingUSD + capPredUSD + holdingActivoUSD;
                const totalInversionesCOP = totalInversionesUSD * trmBase;

                const totalDestinado = destinaciones.reduce((acc, d) => acc + (d.monto || 0), 0);
                const disponibleRealCOP = Math.max(0, saldoBrutoCOP - totalDestinado);

                const porCobrar = porCobrarLista.reduce((acc, r) => acc + Math.max(0, r.montoOriginal - ((r.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const deudas = deudasLista.reduce((acc, d) => acc + Math.max(0, d.montoOriginal - ((d.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                
                const patrimonioNetoCOP = disponibleRealCOP + totalInversionesCOP + totalDestinado + porCobrar - deudas;

                return { saldoBrutoCOP, totalDestinado, disponibleRealCOP, capScalpingUSD, capPredUSD, holdingActivoUSD, totalInversionesCOP, porCobrar, deudas, patrimonioNetoCOP };
            }, [datos, listaCuentas]);

            // Formularios
            const [formMov, setFormMov] = useState({ id: null, concepto: '', monto: '', cuentaId: 'c1', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() });
            const [formTransfer, setFormTransfer] = useState({ cuentaOrigenId: 'c3', cuentaDestinoId: 'c2', monto: '', concepto: 'Transferencia', fechaHora: obtenerFechaHoraActual() });
            const [formAjusteSaldo, setFormAjusteSaldo] = useState({ cuentaId: 'c1', nuevoSaldo: '', nota: '', fechaHora: obtenerFechaHoraActual() });
            const [formDestino, setFormDestino] = useState({ id: null, nombre: '', monto: '', descripcion: '' });
            const [formEjecutarDestino, setFormEjecutarDestino] = useState({ destinacionId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formDeuda, setFormDeuda] = useState({ id: null, entidad: '', concepto: '', montoOriginal: '', fechaVencimiento: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoDeuda, setFormAbonoDeuda] = useState({ deudaId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formPorCobrar, setFormPorCobrar] = useState({ id: null, deudor: '', concepto: '', montoOriginal: '', fechaAcordada: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoCobro, setFormAbonoCobro] = useState({ cobroId: '', cuentaId: 'c1', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [nombreCierre, setNombreCierre] = useState('');

            // Scalping Forms
            const [formTrade, setFormTrade] = useState({ id: null, par: 'BTC/USDT', resultado: 'gain', montoUSD: '', estrategia: '', fechaHora: obtenerFechaHoraActual() });
            const [formCierreInv, setFormCierreInv] = useState({ tipo: 'semanal', nombre: '', tasaTRM: '3950' });
            const [formTransferUtilidad, setFormTransferUtilidad] = useState({ cuentaDestinoId: 'c2', montoCOP: '', fechaHora: obtenerFechaHoraActual() });

            // Holding Forms
            const [formHoldingEntrada, setFormHoldingEntrada] = useState({ id: null, activo: 'BTC', montoUSD: '', trmEntrada: '3950', fechaHora: obtenerFechaHoraActual() });
            const [formHoldingSalida, setFormHoldingSalida] = useState({ holdingId: '', montoUSDSalida: '', trmSalida: '4000', cuentaDestinoId: 'c3', fechaHora: obtenerFechaHoraActual() });

            // Predicciones Forms (En USD)
            const [formPrediccion, setFormPrediccion] = useState({ id: null, activo: 'BTC/USDT', direccion: 'sube', montoInvertidoUSD: '', resultado: 'pendiente', montoRetornadoUSD: '', fechaHora: obtenerFechaHoraActual() });
            const [formCierrePred, setFormCierrePred] = useState({ tipo: 'semanal', nombre: '', tasaTRM: '3950' });

            // Métricas Scalping
            const metricasScalping = useMemo(() => {
                const tradesActivos = (datos?.trades || []).filter(t => !t.cerrado);
                const gains = tradesActivos.filter(t => t.resultado === 'gain');
                const losses = tradesActivos.filter(t => t.resultado === 'loss');
                const totalGainsUSD = gains.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const totalLossesUSD = losses.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const pnlNetoUSD = totalGainsUSD - totalLossesUSD;
                const winRate = tradesActivos.length > 0 ? ((gains.length / tradesActivos.length) * 100).toFixed(1) : '0.0';
                return { winRate, pnlNetoUSD };
            }, [datos.trades]);

            // Métricas Predicciones
            const metricasPredicciones = useMemo(() => {
                const preds = (datos?.predicciones || []).filter(p => !p.cerrado);
                const gains = preds.filter(p => p.resultado === 'acertada');
                const losses = preds.filter(p => p.resultado === 'fallida');
                const totalGainsUSD = gains.reduce((acc, p) => acc + (parseFloat(p.montoRetornadoUSD) - parseFloat(p.montoInvertidoUSD) || 0), 0);
                const totalLossesUSD = losses.reduce((acc, p) => acc + (parseFloat(p.montoInvertidoUSD) || 0), 0);
                const pnlNetoUSD = totalGainsUSD - totalLossesUSD;
                const resueltas = preds.filter(p => p.resultado !== 'pendiente');
                const winRate = resueltas.length > 0 ? ((gains.length / resueltas.length) * 100).toFixed(1) : '0.0';
                return { winRate, pnlNetoUSD };
            }, [datos.predicciones]);

            // Backup JSON
            const exportarBackupJSON = () => {
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(datos, null, 2))}`;
                const a = document.createElement('a');
                a.href = jsonString;
                a.download = `Mis_Finanzas_Jose_Backup_${obtenerFechaHoy()}.json`;
                a.click();
                mostrarNotificacion("💾 Backup exportado (.json)");
            };

            const importarBackupJSON = (e) => {
                const fr = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fr.readAsText(e.target.files[0], "UTF-8");
                    fr.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed && typeof parsed === 'object') {
                                pedirConfirmacion({
                                    titulo: "📥 Importar Backup",
                                    mensaje: "¿Reemplazar datos actuales con esta copia?",
                                    accion: () => { actualizarYGuardar(parsed); mostrarNotificacion("✅ Backup restaurado"); }
                                });
                            }
                        } catch(err) { mostrarNotificacion("Archivo inválido", 'error'); }
                    };
                }
            };

            // Scalping Operaciones
            const guardarTrade = (e) => {
                e.preventDefault();
                const montoNum = parseFloat(formTrade.montoUSD);
                if (isNaN(montoNum) || montoNum <= 0) return mostrarNotificacion("Monto inválido", 'error');

                let tradesAct = [...(datos.trades || [])];
                let cuentasAct = [...listaCuentas];

                if (formTrade.id) {
                    const ant = tradesAct.find(t => t.id === formTrade.id);
                    const deltaAnt = ant.resultado === 'gain' ? -ant.montoUSD : ant.montoUSD;
                    const deltaNuevo = formTrade.resultado === 'gain' ? montoNum : -montoNum;
                    cuentasAct = cuentasAct.map(c => c.id === 'c5' ? { ...c, saldo: Math.max(0, c.saldo + deltaAnt + deltaNuevo) } : c);
                    tradesAct = tradesAct.map(t => t.id === formTrade.id ? { ...t, ...formTrade, montoUSD: montoNum } : t);
                } else {
                    const delta = formTrade.resultado === 'gain' ? montoNum : -montoNum;
                    cuentasAct = cuentasAct.map(c => c.id === 'c5' ? { ...c, saldo: Math.max(0, c.saldo + delta) } : c);
                    tradesAct = [{ id: 'trade_' + Date.now(), ...formTrade, montoUSD: montoNum, cerrado: false }, ...tradesAct];
                }
                actualizarYGuardar({ ...datos, cuentas: cuentasAct, trades: tradesAct });
                setModalVisible(null);
                mostrarNotificacion("✅ Scalp registrado");
            };

            const eliminarTrade = (id) => {
                pedirConfirmacion({
                    titulo: "🗑️ Eliminar Trade",
                    mensaje: "¿Eliminar operación?",
                    accion: () => {
                        const t = datos.trades.find(x => x.id === id);
                        if (!t) return;
                        const delta = t.resultado === 'gain' ? -t.montoUSD : t.montoUSD;
                        const cuentasAct = listaCuentas.map(c => c.id === 'c5' ? { ...c, saldo: Math.max(0, c.saldo + delta) } : c);
                        actualizarYGuardar({ ...datos, cuentas: cuentasAct, trades: datos.trades.filter(x => x.id !== id) });
                        mostrarNotificacion("🗑️ Eliminado");
                    }
                });
            };

            const guardarCierreInversion = (e) => {
                e.preventDefault();
                const trm = parseFloat(formCierreInv.tasaTRM);
                const gananciaUSD = Math.max(0, metricasScalping.pnlNetoUSD);
                const gananciaCOP = gananciaUSD * trm;

                const cuentasAct = listaCuentas.map(c => c.id === 'c5' ? { ...c, saldoCOP: (c.saldoCOP || 0) + gananciaCOP } : c);
                const nuevoCierre = { id: 'c_scalp_' + Date.now(), tipo: formCierreInv.tipo, nombre: formCierreInv.nombre || 'Cierre Scalping', gananciaUSD, tasaTRM: trm, totalCOP: gananciaCOP, fechaHora: obtenerFechaHoraActual() };
                const tradesArchivados = (datos.trades || []).map(t => ({ ...t, cerrado: true }));

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, trades: tradesArchivados, cierresInversion: [nuevoCierre, ...(datos.cierresInversion || [])] });
                setModalVisible(null);
                mostrarNotificacion("🔒 Cierre de Scalping liquidado");
            };

            const transferirUtilidadBinance = (e) => {
                e.preventDefault();
                const monto = parseFloat(formTransferUtilidad.montoCOP);
                const cBinance = listaCuentas.find(c => c.id === 'c5');
                if ((cBinance?.saldoCOP || 0) < monto) return mostrarNotificacion("Saldo COP insuficiente en Binance", 'error');

                const cuentasAct = listaCuentas.map(c => {
                    if (c.id === 'c5') return { ...c, saldoCOP: c.saldoCOP - monto };
                    if (c.id === formTransferUtilidad.cuentaDestinoId) return { ...c, saldo: c.saldo + monto };
                    return c;
                });
                actualizarYGuardar({ ...datos, cuentas: cuentasAct });
                setModalVisible(null);
                mostrarNotificacion("✅ Utilidad transferida");
            };

            // Holding Operaciones (Editar / Eliminar / Comprar / Vender)
            const guardarHoldingEntrada = (e) => {
                e.preventDefault();
                const monto = parseFloat(formHoldingEntrada.montoUSD);
                const trm = parseFloat(formHoldingEntrada.trmEntrada);
                const costoCOP = monto * trm;

                let holdings = [...(datos.holdings || [])];
                if (formHoldingEntrada.id) {
                    holdings = holdings.map(h => h.id === formHoldingEntrada.id ? { ...h, activo: formHoldingEntrada.activo, montoUSD: monto, trmEntrada: trm, costoCOP } : h);
                } else {
                    holdings = [{ id: 'hold_' + Date.now(), activo: formHoldingEntrada.activo, montoUSD: monto, trmEntrada: trm, costoCOP, fechaHora: obtenerFechaHoraActual(), cerrado: false }, ...holdings];
                }
                actualizarYGuardar({ ...datos, holdings });
                setModalVisible(null);
                mostrarNotificacion("💎 Holding guardado");
            };

            const ejecutarSalidaHolding = (e) => {
                e.preventDefault();
                const h = (datos.holdings || []).find(x => x.id === formHoldingSalida.holdingId);
                const usdSalida = parseFloat(formHoldingSalida.montoUSDSalida);
                const trmSalida = parseFloat(formHoldingSalida.trmSalida);
                const valCOP = usdSalida * trmSalida;
                const gananciaNetaCOP = valCOP - h.costoCOP;
                const gananciaUSD = usdSalida - h.montoUSD;
                const porcentaje = (gananciaNetaCOP / h.costoCOP) * 100;

                const cuentasAct = listaCuentas.map(c => c.id === formHoldingSalida.cuentaDestinoId ? { ...c, saldo: c.saldo + valCOP } : c);
                const holdingsAct = (datos.holdings || []).map(x => x.id === h.id ? { ...x, cerrado: true } : x);
                const regCierre = { id: 'c_hold_' + Date.now(), activo: h.activo, gananciaNetaCOP, gananciaUSD, porcentajeRealCOP: porcentaje, fechaHoraCierre: obtenerFechaHoraActual() };

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, holdings: holdingsAct, cierresHolding: [regCierre, ...(datos.cierresHolding || [])] });

                mostrarNotificacion(`🎉 Holding cerrado: +${formatearMoneda(gananciaNetaCOP, 'COP')}`);

                    titulo: "🗑️ Eliminar Holding",

                e.preventDefault();
                const monto = parseFloat(formPrediccion.montoInvertidoUSD);
                const cPred = listaCuentas.find(c => c.id === 'c6');
                if ((cPred?.saldo || 0) < monto && !formPrediccion.id) return mostrarNotificacion("Saldo insuficiente en Fondo Predicciones", 'error');

                let preds = [...(datos.predicciones || [])];
                let cuentasAct = [...listaCuentas];

                if (formPrediccion.id) {
                    preds = preds.map(p => p.id === formPrediccion.id ? { ...p, ...formPrediccion, montoInvertidoUSD: monto } : p);

                    preds = [{ id: 'pred_' + Date.now(), ...formPrediccion, montoInvertidoUSD: monto, cerrado: false }, ...preds];

                preds = preds.map(x => x.id === id ? { ...x, resultado, montoRetornadoUSD: parseFloat(retornadoUSD) } : x);
                actualizarYGuardar({ ...datos, cuentas: cuentasAct, predicciones: preds });
                mostrarNotificacion(resultado === 'acertada' ? "🎯 Predicción Acertada" : "❌ Predicción Fallida");

                const cuentasAct = listaCuentas.map(c => c.id === 'c6' ? { ...c, saldoCOP: (c.saldoCOP || 0) + gananciaCOP } : c);
                const nuevoCierre = { id: 'c_pred_' + Date.now(), tipo: formCierrePred.tipo, nombre: formCierrePred.nombre || 'Cierre Predicciones', gananciaUSD, tasaTRM: trm, totalCOP: gananciaCOP, fechaHora: obtenerFechaHoraActual() };
                const predArchivadas = (datos.predicciones || []).map(p => ({ ...p, cerrado: true }));

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, predicciones: predArchivadas, cierresPredicciones: [nuevoCierre, ...(datos.cierresPredicciones || [])] });

                    titulo: "🗑️ Eliminar Predicción",
                    mensaje: "¿Eliminar?",
                    accion: () => {
                        actualizarYGuardar({ ...datos, predicciones: (datos.predicciones || []).filter(x => x.id !== id) });

            // Movimientos Generales

                e.preventDefault();

                                        <div className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl flex justify-between items-center">
                                            <div><span className="text-xs text-neutral-400 uppercase">Capital Predicciones (USD)</span><div className="text-3xl font-black text-purple-400 mt-1">{formatearMoneda(totales.capPredUSD, 'USD')}</div></div>
                                            <div className="flex gap-2">
                                                <button onClick={() => { setFormPrediccion({ id: null, activo: 'BTC/USDT', direccion: 'sube', montoInvertidoUSD: '', resultado: 'pendiente', montoRetornadoUSD: '' }); setModalVisible('prediccion'); }} className="bg-purple-500 text-neutral-950 text-xs font-extrabold px-4 py-3 rounded-xl">+ Predicción</button>
                                                <button onClick={() => setModalVisible('cierrePred')} className="bg-neutral-800 text-purple-400 border border-purple-500/30 text-xs font-bold px-4 py-3 rounded-xl">🔒 Cierre</button>
                                            </div>
                                        </div>
                                        <div className="space-y-2">
                                            {(datos.predicciones || []).filter(p => !p.cerrado).map(p => (
                                                <div key={p.id} className="bg-neutral-900 border border-neutral-800 p-3.5 rounded-2xl flex justify-between items-center text-xs">
                                                    <div><span className={`font-bold ${p.direccion === 'sube' ? 'text-emerald-400' : 'text-red-500'}`}>{p.direccion.toUpperCase()}</span> • <strong className="text-white">{p.activo}</strong> ({p.resultado})</div>
                                                    <div className="text-right">
                                                        <div className="font-black text-white">{formatearMoneda(p.montoInvertidoUSD, 'USD')}</div>
                                                        {p.resultado === 'pendiente' && (
                                                            <div className="flex gap-1 mt-1">
                                                                <button onClick={() => { const ret = prompt("Monto retornado en USD:"); if(ret) resolverPrediccion(p.id, 'acertada', ret); }} className="text-emerald-400 underline">Acertó</button>
                                                                <button onClick={() => resolverPrediccion(p.id, 'fallida')} className="text-red-500 underline">Falló</button>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* HISTORIAL */}
                        {rubroActivo === 'movimientos' && (
                            <div className="space-y-2">
                                {(datos.movimientos || []).map(m => (
                                    <div key={m.id} className="bg-neutral-900 border border-neutral-800 p-4 rounded-2xl flex justify-between items-center text-xs">
                                        <div><h4 className="font-bold text-white">{m.concepto}</h4><span className="text-neutral-400">{formatearFechaHora(m.fechaHora)}</span></div>
                                        <div className="text-right"><div className={`font-black ${m.tipo === 'ingreso' ? 'text-emerald-400' : 'text-red-500'}`}>{m.tipo === 'ingreso' ? '+' : '-'}{formatearMoneda(m.monto, 'COP')}</div><button onClick={() => eliminarMovimiento(m.id)} className="text-neutral-500 underline">Eliminar</button></div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* MODALES */}
                    {modalVisible === 'trade' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarTrade} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Registrar Scalp</h3>
                                <input type="text" required value={formTrade.par} onChange={e => setFormTrade({...formTrade, par: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <select value={formTrade.resultado} onChange={e => setFormTrade({...formTrade, resultado: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3"><option value="gain">Gain</option><option value="loss">Loss</option></select>
                                <input type="number" step="any" required placeholder="USD" value={formTrade.montoUSD} onChange={e => setFormTrade({...formTrade, montoUSD: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="text" placeholder="Estrategia" value={formTrade.estrategia} onChange={e => setFormTrade({...formTrade, estrategia: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-amber-500 text-neutral-950 font-bold py-3 rounded-xl">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'cierreInversion' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarCierreInversion} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Cierre Scalping</h3>
                                <select value={formCierreInv.tipo} onChange={e => setFormCierreInv({...formCierreInv, tipo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3"><option value="semanal">Semanal</option><option value="mensual">Mensual</option></select>
                                <input type="text" placeholder="Nombre" value={formCierreInv.nombre} onChange={e => setFormCierreInv({...formCierreInv, nombre: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" required placeholder="TRM COP" value={formCierreInv.tasaTRM} onChange={e => setFormCierreInv({...formCierreInv, tasaTRM: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-amber-500 text-neutral-950 font-bold py-3 rounded-xl">Liquidar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'holdingEntrada' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarHoldingEntrada} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Holding</h3>
                                <input type="text" required placeholder="Activo" value={formHoldingEntrada.activo} onChange={e => setFormHoldingEntrada({...formHoldingEntrada, activo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" step="any" required placeholder="USD" value={formHoldingEntrada.montoUSD} onChange={e => setFormHoldingEntrada({...formHoldingEntrada, montoUSD: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" required placeholder="TRM Entrada" value={formHoldingEntrada.trmEntrada} onChange={e => setFormHoldingEntrada({...formHoldingEntrada, trmEntrada: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-cyan-500 text-neutral-950 font-bold py-3 rounded-xl">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'holdingSalida' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={ejecutarSalidaHolding} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Vender Holding</h3>
                                <input type="number" step="any" required placeholder="USD Salida" value={formHoldingSalida.montoUSDSalida} onChange={e => setFormHoldingSalida({...formHoldingSalida, montoUSDSalida: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" required placeholder="TRM Salida" value={formHoldingSalida.trmSalida} onChange={e => setFormHoldingSalida({...formHoldingSalida, trmSalida: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <select value={formHoldingSalida.cuentaDestinoId} onChange={e => setFormHoldingSalida({...formHoldingSalida, cuentaDestinoId: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3">{listaCuentas.filter(c => c.moneda !== 'USD').map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select>
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-cyan-500 text-neutral-950 font-bold py-3 rounded-xl">Vender</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'prediccion' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarPrediccion} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Predicción (USD)</h3>
                                <input type="text" required placeholder="Activo" value={formPrediccion.activo} onChange={e => setFormPrediccion({...formPrediccion, activo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <select value={formPrediccion.direccion} onChange={e => setFormPrediccion({...formPrediccion, direccion: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3"><option value="sube">Sube (Long)</option><option value="baja">Baja (Short)</option></select>
                                <input type="number" step="any" required placeholder="Monto USD" value={formPrediccion.montoInvertidoUSD} onChange={e => setFormPrediccion({...formPrediccion, montoInvertidoUSD: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-purple-500 text-neutral-950 font-bold py-3 rounded-xl">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'cierrePred' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarCierrePredicciones} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Cierre Predicciones</h3>
                                <select value={formCierrePred.tipo} onChange={e => setFormCierrePred({...formCierrePred, tipo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3"><option value="semanal">Semanal</option><option value="mensual">Mensual</option></select>
                                <input type="text" placeholder="Nombre" value={formCierrePred.nombre} onChange={e => setFormCierrePred({...formCierrePred, nombre: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" required placeholder="TRM COP" value={formCierrePred.tasaTRM} onChange={e => setFormCierrePred({...formCierrePred, tasaTRM: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-purple-500 text-neutral-950 font-bold py-3 rounded-xl">Liquidar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'movimiento' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarMovimiento} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Movimiento</h3>
                                <select value={formMov.tipo} onChange={e => setFormMov({...formMov, tipo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select>
                                <select value={formMov.cuentaId} onChange={e => setFormMov({...formMov, cuentaId: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3">{listaCuentas.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select>
                                <input type="text" required placeholder="Concepto" value={formMov.concepto} onChange={e => setFormMov({...formMov, concepto: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <input type="number" required placeholder="Monto" value={formMov.monto} onChange={e => setFormMov({...formMov, monto: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 font-bold py-3 rounded-xl">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'transferencia' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={realizarTransferencia} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Transferencia</h3>
                                <select value={formTransfer.cuentaOrigenId} onChange={e => setFormTransfer({...formTransfer, cuentaOrigenId: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3">{listaCuentas.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select>
                                <select value={formTransfer.cuentaDestinoId} onChange={e => setFormTransfer({...formTransfer, cuentaDestinoId: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3">{listaCuentas.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}</select>
                                <input type="number" required placeholder="Monto" value={formTransfer.monto} onChange={e => setFormTransfer({...formTransfer, monto: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-amber-500 text-neutral-950 font-bold py-3 rounded-xl">Transferir</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'ajusteSaldo' && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
                            <form onSubmit={guardarAjusteSaldo} className="bg-neutral-900 p-5 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-bold text-white">Calibrar Saldo</h3>
                                <input type="number" step="any" required placeholder="Nuevo Saldo" value={formAjusteSaldo.nuevoSaldo} onChange={e => setFormAjusteSaldo({...formAjusteSaldo, nuevoSaldo: e.target.value})} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3" />
                                <div className="flex gap-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-white py-3 rounded-xl">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 font-bold py-3 rounded-xl">Calibrar</button></div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Aplicacion/>);
    </script>
</body>
</html>
