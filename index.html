<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mis Finanzas — Jose</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; overscroll-behavior-y: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
        .safe-bottom-padding { padding-bottom: max(22px, env(safe-area-inset-bottom)); }
        .safe-bottom-margin-btn { bottom: max(100px, calc(88px + env(safe-area-inset-bottom))); }
    </style>
    <script>
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if(e.keyCode == 123) return false; 
            if(e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false; 
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; 
        }
    </script>
</head>
<body class="bg-black text-neutral-100 min-h-screen pb-48 md:pb-6">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // LLAVES DE SUPABASE INTEGRADAS
        const SUPABASE_URL = "https://hvjlkjyyyjqebibtffkl.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ags0yzMs4NRe4nBGbIGN-g_YiFX_r9_";

        const CATEGORIAS_MOV = ['General', 'Alimentación', 'Transporte', 'Vivienda y Servicios', 'Ocio y Entretenimiento', 'Salud', 'Educación', 'Préstamo Otorgado', 'Abono a Deuda', 'Cobro Recibido', 'Ingreso Extra', 'Sueldo/Honorarios', 'Fondeo/Retiro Inversión', 'Intercambio Divisas'];

        const obtenerFechaHoraActual = () => {
            const ahora = new Date();
            ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
            return ahora.toISOString().slice(0, 16);
        };
        const obtenerFechaHoy = () => new Date().toISOString().slice(0, 10);

        const CUENTAS_PREDETERMINADAS = [
            { id: "c1", nombre: "Daviplata", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c2", nombre: "Nequi", tipo: "Billetera Digital", saldo: 0, moneda: "COP", activa: true },
            { id: "c3", nombre: "Bancolombia", tipo: "Banco", saldo: 0, moneda: "COP", activa: true },
            { id: "c4", nombre: "Efectivo", tipo: "Efectivo", saldo: 0, moneda: "COP", activa: true },
            { id: "c5", nombre: "Binance", tipo: "Inversión", saldo: 0, saldoCOP: 0, moneda: "USD", activa: true },
            { id: "c6", nombre: "Fondo Predicciones", tipo: "Inversión", saldo: 0, saldoCOP: 0, moneda: "USD", activa: true }
        ];

        const ESTADO_INICIAL = {
            cuentas: CUENTAS_PREDETERMINADAS, deudas: [], porCobrar: [], movimientos: [], destinaciones: [],
            cierresMensuales: [], trades: [], cierresInversion: [], holdings: [], cierresHolding: [], predicciones: [], cierresPredicciones: []
        };

        function Aplicacion() {
            // AUTENTICACIÓN
            const [sesion, setSesion] = useState(null);
            const [cargandoAuth, setCargandoAuth] = useState(true);
            const [emailLogin, setEmailLogin] = useState('');
            const [passLogin, setPassLogin] = useState('');
            const [errorAuth, setErrorAuth] = useState('');

            // ESTADOS GLOBALES
            const [datos, setDatos] = useState(ESTADO_INICIAL);
            const [precioUSDT, setPrecioUSDT] = useState(4000); 
            const [ocultarSaldos, setOcultarSaldos] = useState(false);
            const [menuAdminAbierto, setMenuAdminAbierto] = useState(false);
            const [rubroActivo, setRubroActivo] = useState('inicio');
            const [subRubroTrade, setSubRubroTrade] = useState('scalping');
            
            // UI INTERACTIVA
            const [modalVisible, setModalVisible] = useState(null);
            const [confirmacion, setConfirmacion] = useState(null);
            const [notificacion, setNotificacion] = useState(null);
            const [historialExp, setHistorialExp] = useState({});

            const [busquedaMov, setBusquedaMov] = useState('');
            const [filtroCuentaMov, setFiltroCuentaMov] = useState('todas');

            const clienteSupabase = useRef(null);
            const inputFileRef = useRef(null);

            // API BINANCE (EN VIVO)
            useEffect(() => {
                const fetchUSDT = async () => {
                    try {
                        const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTCOP');
                        const data = await res.json();
                        if (data && data.price) setPrecioUSDT(parseFloat(data.price));
                    } catch (e) { console.warn("Error api Binance"); }
                };
                fetchUSDT();
                const intervalo = setInterval(fetchUSDT, 30000); 
                return () => clearInterval(intervalo);
            }, []);

            const mostrarNotificacion = (mensaje, tipo = 'exito') => { setNotificacion({ mensaje, tipo }); setTimeout(() => setNotificacion(null), 3000); };
            const pedirConfirmacion = ({ titulo, mensaje, accion }) => setConfirmacion({ titulo, mensaje, accion });
            const cambiarRubro = (nuevoRubro) => { setBusquedaMov(''); setRubroActivo(nuevoRubro); };
            const toggleHistorial = (id) => setHistorialExp(prev => ({ ...prev, [id]: !prev[id] }));

            // SUPABASE INIT
            useEffect(() => {
                try {
                    if (window.supabase && SUPABASE_URL) {
                        clienteSupabase.current = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                        clienteSupabase.current.auth.getSession().then(({ data: { session } }) => {
                            setSesion(session); setCargandoAuth(false);
                            if (session) cargarDesdeSupabase();
                        });
                        clienteSupabase.current.auth.onAuthStateChange((_event, session) => {
                            setSesion(session);
                            if (session) cargarDesdeSupabase(); else setDatos(ESTADO_INICIAL);
                        });
                    } else { setCargandoAuth(false); }
                } catch(e) { setCargandoAuth(false); }
            }, []);

            const manejarLogin = async (e) => {
                e.preventDefault();
                if (!clienteSupabase.current) return setErrorAuth("Faltan llaves de Supabase");
                setErrorAuth(''); setCargandoAuth(true);
                const { error } = await clienteSupabase.current.auth.signInWithPassword({ email: emailLogin, password: passLogin });
                if (error) { setErrorAuth('❌ Correo o contraseña incorrectos'); setCargandoAuth(false); }
            };

            const cerrarSesion = async () => { await clienteSupabase.current.auth.signOut(); mostrarNotificacion("🔒 Bóveda cerrada"); };

            const cargarDesdeSupabase = async () => {
                if (!clienteSupabase.current) return;
                try {
                    const { data: respuesta, error } = await clienteSupabase.current.from('app_data').select('content').eq('id', 'jose_finanzas').single();
                    if (error && error.code !== 'PGRST116') return;
                    if (respuesta && respuesta.content) {
                        const remoto = respuesta.content;
                        if (!remoto.cuentas) remoto.cuentas = CUENTAS_PREDETERMINADAS;
                        setDatos({ ...ESTADO_INICIAL, ...remoto });
                    } else { guardarEnSupabase(ESTADO_INICIAL); }
                } catch(err) {}
            };

            const guardarEnSupabase = async (nuevosDatos) => {
                if (!clienteSupabase.current) return;
                try { await clienteSupabase.current.from('app_data').upsert({ id: 'jose_finanzas', content: nuevosDatos, updated_at: new Date() }); } catch(err) {}
            };

            const actualizarYGuardar = (nuevosDatos) => { setDatos(nuevosDatos); guardarEnSupabase(nuevosDatos); };

            const formatearMoneda = (valor, moneda = 'COP') => {
                if (ocultarSaldos) return '••••••';
                if (moneda === 'USD') return '$' + (valor || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USD';
                return '$' + (valor || 0).toLocaleString('es-CO') + ' COP';
            };

            const formatearFechaHora = (cadenaFecha) => {
                if (!cadenaFecha) return '';
                return new Date(cadenaFecha).toLocaleString('es-CO', { year: '2-digit', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true });
            };

            const exportarBackupJSON = () => {
                const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(datos, null, 2))}`;
                const a = document.createElement('a');
                a.href = jsonString; a.download = `Mis_Finanzas_Jose_Backup_${obtenerFechaHoy()}.json`; a.click();
                mostrarNotificacion("💾 Backup exportado");
            };

            const importarBackupJSON = (e) => {
                const fr = new FileReader();
                if (e.target.files && e.target.files[0]) {
                    fr.readAsText(e.target.files[0], "UTF-8");
                    fr.onload = (event) => {
                        try {
                            const parsed = JSON.parse(event.target.result);
                            if (parsed && typeof parsed === 'object') {
                                pedirConfirmacion({
                                    titulo: "📥 Importar Copia", mensaje: "Reemplazará los datos actuales en la nube. ¿Continuar?",
                                    accion: () => { actualizarYGuardar(parsed); mostrarNotificacion("✅ Datos restaurados"); }
                                });
                            }
                        } catch (err) { mostrarNotificacion("Archivo inválido", 'error'); }
                    };
                }
            };

            // PARCHE DE RETROCOMPATIBILIDAD: Asegura que todas las cuentas tengan una moneda asignada
            const listaCuentas = useMemo(() => {
                let list = (datos?.cuentas && datos.cuentas.length > 0) ? datos.cuentas : CUENTAS_PREDETERMINADAS;
                return list.map(c => ({
                    ...c,
                    moneda: c.moneda || (c.id === 'c5' || c.id === 'c6' ? 'USD' : 'COP') // Asigna COP por defecto a cuentas antiguas
                }));
            }, [datos]);

            // CÁLCULOS PATRIMONIALES
            const totales = useMemo(() => {
                const liquidezBrutaCOP = listaCuentas.filter(c => c.moneda === 'COP').reduce((acc, c) => acc + c.saldo, 0);
                const totalDestinado = (datos?.destinaciones || []).reduce((acc, d) => acc + (d.monto || 0), 0);
                const liquidezLibreCOP = Math.max(0, liquidezBrutaCOP - totalDestinado);

                const capScalpingUSD = listaCuentas.find(c => c.id === 'c5')?.saldo || 0;
                const capPredUSD = listaCuentas.find(c => c.id === 'c6')?.saldo || 0;
                const holdingActivoUSD = (datos?.holdings || []).filter(h => !h.cerrado).reduce((acc, h) => acc + (parseFloat(h.montoUSD) || 0), 0);
                
                const totalInversionesUSD = capScalpingUSD + capPredUSD + holdingActivoUSD;
                const totalInversionesCOP = totalInversionesUSD * precioUSDT; 

                const carteraActiva = (datos?.porCobrar || []).reduce((acc, r) => acc + Math.max(0, r.montoOriginal - ((r.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const pasivosTotales = (datos?.deudas || []).reduce((acc, d) => acc + Math.max(0, d.montoOriginal - ((d.abonos || []).reduce((pAcc, p) => pAcc + p.monto, 0))), 0);
                const patrimonioNetoCOP = liquidezBrutaCOP + totalInversionesCOP + carteraActiva - pasivosTotales;

                return { liquidezBrutaCOP, liquidezLibreCOP, totalDestinado, capScalpingUSD, capPredUSD, holdingActivoUSD, totalInversionesUSD, totalInversionesCOP, carteraActiva, pasivosTotales, patrimonioNetoCOP };
            }, [datos, listaCuentas, precioUSDT]);

            const metricasScalping = useMemo(() => {
                const tradesActivos = (datos?.trades || []).filter(t => !t.cerrado);
                const gains = tradesActivos.filter(t => t.resultado === 'gain');
                const losses = tradesActivos.filter(t => t.resultado === 'loss');
                const totalGainsUSD = gains.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const totalLossesUSD = losses.reduce((acc, t) => acc + (parseFloat(t.montoUSD) || 0), 0);
                const pnlNetoUSD = totalGainsUSD - totalLossesUSD;
                const winRate = tradesActivos.length > 0 ? ((gains.length / tradesActivos.length) * 100).toFixed(1) : '0.0';
                const avgGain = gains.length > 0 ? totalGainsUSD / gains.length : 0;
                const avgLoss = losses.length > 0 ? totalLossesUSD / losses.length : 0;
                const ratioRR = avgLoss > 0 ? (avgGain / avgLoss).toFixed(2) : (avgGain > 0 ? '∞' : '0.00');

                // LÓGICA DE CURVA DE CAPITAL Y DRAWDOWN
                const todosLosTrades = [...(datos?.trades || [])].sort((a, b) => new Date(a.fechaHora) - new Date(b.fechaHora));
                let saldoSimulado = 1000; 
                let peak = saldoSimulado;
                let maxDD = 0;
                const sparklinePointsArr = [saldoSimulado];

                todosLosTrades.forEach(t => {
                    const delta = t.resultado === 'gain' ? parseFloat(t.montoUSD) : -parseFloat(t.montoUSD);
                    saldoSimulado += delta;
                    sparklinePointsArr.push(saldoSimulado);
                    if (saldoSimulado > peak) peak = saldoSimulado;
                    const dd = ((peak - saldoSimulado) / peak) * 100;
                    if (dd > maxDD) maxDD = dd;
                });

                let svgPoints = "";
                if (sparklinePointsArr.length > 1) {
                    const minVal = Math.min(...sparklinePointsArr);
                    const maxVal = Math.max(...sparklinePointsArr);
                    const rangoY = (maxVal - minVal) || 1;
                    const pasoX = 100 / (sparklinePointsArr.length - 1);
                    svgPoints = sparklinePointsArr.map((val, i) => `${i * pasoX},${100 - (((val - minVal) / rangoY) * 100)}`).join(" ");
                }

                return { totalTrades: tradesActivos.length, winRate, avgGain, avgLoss, ratioRR, pnlNetoUSD, maxDD: maxDD.toFixed(1), sparklinePoints: svgPoints };
            }, [datos.trades]);

            const metricasHolding = useMemo(() => {
                const hCerrados = datos?.cierresHolding || [];
                const ganancias = hCerrados.filter(h => h.gananciaNetaCOP > 0);
                const winRate = hCerrados.length > 0 ? ((ganancias.length / hCerrados.length) * 100).toFixed(1) : '0.0';
                const pnlTotalCOP = hCerrados.reduce((acc, h) => acc + (h.gananciaNetaCOP || 0), 0);
                const pnlTotalUSD = hCerrados.reduce((acc, h) => acc + (h.gananciaUSD || 0), 0);
                return { winRate, pnlTotalCOP, pnlTotalUSD };
            }, [datos.cierresHolding]);

            const metricasPredicciones = useMemo(() => {
                const predsActivas = (datos?.predicciones || []).filter(p => !p.cerrado);
                const resueltas = predsActivas.filter(p => p.resultado !== 'pendiente');
                const aciertos = resueltas.filter(p => p.resultado === 'acertada');
                const winRate = resueltas.length > 0 ? ((aciertos.length / resueltas.length) * 100).toFixed(1) : '0.0';
                const pnlNetoUSD = resueltas.reduce((acc, p) => {
                    if (p.resultado === 'acertada') return acc + (parseFloat(p.montoRetornadoUSD || 0) - parseFloat(p.montoInvertidoUSD || 0));
                    return acc - parseFloat(p.montoInvertidoUSD || 0);
                }, 0);
                return { total: predsActivas.length, winRate, aciertosCount: aciertos.length, fallidasCount: resueltas.length - aciertos.length, pnlNetoUSD };
            }, [datos.predicciones]);

            // ESTADOS FORMULARIOS
            const [formP2P, setFormP2P] = useState({ tipo: 'compra', cuentaCOPId: '', cuentaUSDId: '', montoCOP: '', montoUSD: '', fechaHora: obtenerFechaHoraActual() });
            const [formMov, setFormMov] = useState({ id: null, concepto: '', monto: '', cuentaId: '', tipo: 'ingreso', categoria: 'General', fechaHora: obtenerFechaHoraActual() });
            const [formDeuda, setFormDeuda] = useState({ id: null, entidad: '', concepto: '', montoOriginal: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoDeuda, setFormAbonoDeuda] = useState({ deudaId: '', cuentaId: '', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formPorCobrar, setFormPorCobrar] = useState({ id: null, deudor: '', concepto: '', montoOriginal: '', fechaHora: obtenerFechaHoraActual() });
            const [formAbonoCobro, setFormAbonoCobro] = useState({ cobroId: '', cuentaId: '', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formDestino, setFormDestino] = useState({ id: null, nombre: '', monto: '', descripcion: '' });
            const [formEjecutarDestino, setFormEjecutarDestino] = useState({ destinacionId: '', cuentaId: '', monto: '', fechaHora: obtenerFechaHoraActual() });
            const [formTransfer, setFormTransfer] = useState({ cuentaOrigenId: '', cuentaDestinoId: '', monto: '', concepto: 'Transferencia propia', fechaHora: obtenerFechaHoraActual() });
            const [formAjusteSaldo, setFormAjusteSaldo] = useState({ cuentaId: '', nuevoSaldo: '', nota: '', clasificacion: 'Descuadre injustificado', fechaHora: obtenerFechaHoraActual() });
            
            const [formTrade, setFormTrade] = useState({ id: null, par: 'BTC/USDT', resultado: 'gain', montoUSD: '', estrategia: '', fechaHora: obtenerFechaHoraActual() });
            const [formCierreInv, setFormCierreInv] = useState({ tipo: 'semanal', nombre: '', tasaTRM: precioUSDT });
            const [formTransferUtilidad, setFormTransferUtilidad] = useState({ cuentaDestinoId: '', montoCOP: '', fechaHora: obtenerFechaHoraActual() });
            const [formHoldingEntrada, setFormHoldingEntrada] = useState({ id: null, activo: 'BTC', montoUSD: '', trmEntrada: precioUSDT, fechaHora: obtenerFechaHoraActual() });
            const [formHoldingSalida, setFormHoldingSalida] = useState({ holdingId: '', montoUSDSalida: '', trmSalida: precioUSDT, cuentaDestinoId: '', fechaHora: obtenerFechaHoraActual() });
            const [formPrediccion, setFormPrediccion] = useState({ id: null, activo: 'BTC/USDT', direccion: 'sube', montoInvertidoUSD: '', resultado: 'pendiente', montoRetornadoUSD: '', cuentaId: 'c6', fechaHora: obtenerFechaHoraActual() });
            const [formCierrePred, setFormCierrePred] = useState({ tipo: 'semanal', nombre: '', tasaTRM: precioUSDT });
            const [formAnularCierre, setFormAnularCierre] = useState({ id: '', tipo: '', razon: '' });
            const [formEditCierre, setFormEditCierre] = useState({ id: '', tipo: '', nombre: '', tasaTRM: '' });
            const [formResolverPred, setFormResolverPred] = useState({ id: '', montoRetornadoUSD: '' });

            // FUNCIÓN CAMBIO P2P
            const ejecutarCambioP2P = (e) => {
                e.preventDefault();
                const mCOP = parseFloat(formP2P.montoCOP);
                const mUSD = parseFloat(formP2P.montoUSD);
                if (isNaN(mCOP) || mCOP <= 0 || isNaN(mUSD) || mUSD <= 0) return mostrarNotificacion("Montos inválidos", 'error');

                const cCOP = listaCuentas.find(c => c.id === formP2P.cuentaCOPId);
                const cUSD = listaCuentas.find(c => c.id === formP2P.cuentaUSDId);
                if (!cCOP || !cUSD) return mostrarNotificacion("Falta seleccionar cuenta", 'error');

                const trm = (mCOP / mUSD).toFixed(2);
                let cuentasAct = [...listaCuentas];
                let nuevosMovs = [];

                if (formP2P.tipo === 'compra') {
                    if (cCOP.saldo < mCOP) return mostrarNotificacion("Saldo COP insuficiente", 'error');
                    cuentasAct = cuentasAct.map(c => {
                        if (c.id === cCOP.id) return { ...c, saldo: c.saldo - mCOP };
                        if (c.id === cUSD.id) return { ...c, saldo: c.saldo + mUSD };
                        return c;
                    });
                    nuevosMovs.push({ id: 'm_p2p_e_' + Date.now(), fechaHora: formP2P.fechaHora, concepto: `💱 Fondeo P2P hacia ${cUSD.nombre} (TRM: $${trm})`, monto: mCOP, tipo: 'egreso', cuentaId: cCOP.id, categoria: 'Intercambio Divisas', moneda: 'COP' });
                    nuevosMovs.push({ id: 'm_p2p_i_' + Date.now(), fechaHora: formP2P.fechaHora, concepto: `💱 Compra P2P desde ${cCOP.nombre} (TRM: $${trm})`, monto: mUSD, tipo: 'ingreso', cuentaId: cUSD.id, categoria: 'Intercambio Divisas', moneda: 'USD' });
                } else {
                    if (cUSD.saldo < mUSD) return mostrarNotificacion("Saldo USD insuficiente", 'error');
                    cuentasAct = cuentasAct.map(c => {
                        if (c.id === cUSD.id) return { ...c, saldo: c.saldo - mUSD };
                        if (c.id === cCOP.id) return { ...c, saldo: c.saldo + mCOP };
                        return c;
                    });
                    nuevosMovs.push({ id: 'm_p2p_e_' + Date.now(), fechaHora: formP2P.fechaHora, concepto: `💱 Venta P2P hacia ${cCOP.nombre} (TRM: $${trm})`, monto: mUSD, tipo: 'egreso', cuentaId: cUSD.id, categoria: 'Intercambio Divisas', moneda: 'USD' });
                    nuevosMovs.push({ id: 'm_p2p_i_' + Date.now(), fechaHora: formP2P.fechaHora, concepto: `💱 Retiro P2P desde ${cUSD.nombre} (TRM: $${trm})`, monto: mCOP, tipo: 'ingreso', cuentaId: cCOP.id, categoria: 'Intercambio Divisas', moneda: 'COP' });
                }

                actualizarYGuardar({ ...datos, cuentas: cuentasAct, movimientos: [...nuevosMovs, ...(datos.movimientos || [])] });
                setModalVisible(null);
                mostrarNotificacion("💱 Cambio P2P Exitoso");
            };

            // FUNCIONES DEUDAS Y CARTERA
            const guardarDeuda = (e) => {
                e.preventDefault();
                const orig = parseFloat(formDeuda.montoOriginal) || 0;
                let lista = [...(datos.deudas || [])];
                if (formDeuda.id) lista = lista.map(d => d.id === formDeuda.id ? { ...d, entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig } : d);
                else lista.push({ id: 'd_' + Date.now(), entidad: formDeuda.entidad, concepto: formDeuda.concepto, montoOriginal: orig, fechaHora: formDeuda.fechaHora, abonos: [] });
                actualizarYGuardar({ ...datos, deudas: lista });
                setModalVisible(null); mostrarNotificacion("✅ Deuda registrada");
            };

            const abonarDeuda = (e) => {
                e.preventDefault();
                const monto = parseFloat(formAbonoDeuda.monto);
                if (isNaN(monto) || monto <= 0) return mostrarNotificacion("Monto inválido", 'error');
                if (!formAbonoDeuda.cuentaId) return mostrarNotificacion("Selecciona una cuenta", 'error');

                const cuentaUsada = listaCuentas.find(c => c.id === formAbonoDeuda.cuentaId);
                const deudaSel = (datos.deudas || []).find(d => d.id === formAbonoDeuda.deudaId);

                    else if (p.resultado === 'acertada') cuentasAct = cuentasAct.map(c => c.id === 'c6' ? { ...c, saldo: c.saldo + p.montoInvertidoUSD - p.montoRetornadoUSD } : c);
                    actualizarYGuardar({ ...datos, cuentas: cuentasAct, predicciones: datos.predicciones.filter(x => x.id !== id) });
                    mostrarNotificacion("Eliminada");
                }});
            };
            const guardarCierrePred = (e) => {
                e.preventDefault();
                const trm = parseFloat(formCierrePred.tasaTRM);
                const gananciaUSD = Math.max(0, metricasPredicciones.pnlNetoUSD);
                const gananciaCOP = gananciaUSD * trm;
                const cuentasAct = listaCuentas.map(c => c.id === 'c6' ? { ...c, saldoCOP: (c.saldoCOP || 0) + gananciaCOP } : c);
                const nuevoCierre = { id: 'c_pred_' + Date.now(), tipo: formCierrePred.tipo, nombre: formCierrePred.nombre || 'Cierre', fechaHora: obtenerFechaHoraActual(), gananciaUSD, tasaTRM: trm, totalCOP: gananciaCOP };
                const nuevoMov = gananciaCOP > 0 ? { id: 'm_cpred_' + Date.now(), fechaHora: obtenerFechaHoraActual(), concepto: `🔮 Cierre Predicciones ${nuevoCierre.nombre}`, monto: gananciaCOP, tipo: 'ingreso', cuentaId: 'c6', categoria: 'Ingreso Extra', moneda: 'COP' } : null;
                const predArchivadas = (datos.predicciones || []).map(p => ({ ...p, cerrado: true }));

            const abrirAnularCierre = (id, tipo) => { setFormAnularCierre({ id, tipo, razon: '' }); setModalVisible('anularCierre'); };
            const procesarAnulacionCierre = (e) => {
                e.preventDefault();
                const { id, tipo, razon } = formAnularCierre;
                if (tipo === 'scalping') {
                    const c = (datos.cierresInversion || []).find(x => x.id === id);
                    const cuentasAct = listaCuentas.map(cta => cta.id === 'c5' ? { ...cta, saldoCOP: Math.max(0, (cta.saldoCOP || 0) - c.totalCOP) } : cta);

                    const c = (datos.cierresHolding || []).find(x => x.id === id);

                    actualizarYGuardar({ ...datos, cierresHolding: datos.cierresHolding.filter(x => x.id !== id), movimientos: [nuevoMov, ...(datos.movimientos || [])] });

                setModalVisible(null); mostrarNotificacion("Anulada con éxito");

            const abrirEditarCierre = (c, tipo) => { setFormEditCierre({ id: c.id, tipo, nombre: c.nombre || c.activo, tasaTRM: c.tasaTRM || c.trmSalida }); setModalVisible('editarCierre'); };
            const procesarEdicionCierre = (e) => {
                e.preventDefault();
                const { id, tipo, nombre, tasaTRM } = formEditCierre;

                                        {listaCuentas.filter(c => c.moneda === 'COP').map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-cyan-500 text-neutral-950 py-3 rounded-xl font-extrabold">Recibir</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'deuda' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={guardarDeuda} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Registrar Deuda</h3>
                                <div><label className="text-xs text-neutral-400">Entidad</label><input type="text" required value={formDeuda.entidad} onChange={e => setFormDeuda({ ...formDeuda, entidad: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Concepto</label><input type="text" required value={formDeuda.concepto} onChange={e => setFormDeuda({ ...formDeuda, concepto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Monto</label><input type="number" required value={formDeuda.montoOriginal} onChange={e => setFormDeuda({ ...formDeuda, montoOriginal: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-red-600 text-white py-3 rounded-xl font-extrabold">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'porCobrar' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={guardarPorCobrar} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Registrar Préstamo</h3>
                                <div><label className="text-xs text-neutral-400">Deudor</label><input type="text" required value={formPorCobrar.deudor} onChange={e => setFormPorCobrar({ ...formPorCobrar, deudor: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Concepto</label><input type="text" required value={formPorCobrar.concepto} onChange={e => setFormPorCobrar({ ...formPorCobrar, concepto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Monto</label><input type="number" required value={formPorCobrar.montoOriginal} onChange={e => setFormPorCobrar({ ...formPorCobrar, montoOriginal: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-cyan-500 text-neutral-950 py-3 rounded-xl font-extrabold">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'destinacion' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={guardarDestinacion} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">Destinación</h3>
                                <div><label className="text-xs text-neutral-400">Nombre</label><input type="text" required value={formDestino.nombre} onChange={e => setFormDestino({ ...formDestino, nombre: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div><label className="text-xs text-neutral-400">Monto</label><input type="number" required value={formDestino.monto} onChange={e => setFormDestino({ ...formDestino, monto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1 font-bold text-lg" /></div>
                                <div><label className="text-xs text-neutral-400">Descripción</label><input type="text" value={formDestino.descripcion} onChange={e => setFormDestino({ ...formDestino, descripcion: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1" /></div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 py-3 rounded-xl font-extrabold">Guardar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'ejecutarDestinacion' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={ejecutarPagoDestinacion} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">⚡ Ejecutar Gasto Destinado</h3>
                                <div><label className="text-xs text-neutral-400">Monto</label><input type="number" required value={formEjecutarDestino.monto} onChange={e => setFormEjecutarDestino({ ...formEjecutarDestino, monto: e.target.value })} className="w-full bg-black border border-neutral-800 text-white rounded-xl p-3 mt-1 font-bold text-lg" /></div>
                                <div>
                                    <label className="text-xs text-emerald-400 font-bold">Cuenta de salida</label>
                                    <select required value={formEjecutarDestino.cuentaId} onChange={e => setFormEjecutarDestino({ ...formEjecutarDestino, cuentaId: e.target.value })} className="w-full bg-black border border-emerald-500/50 text-white font-bold rounded-xl p-3 mt-1">
                                        <option value="" disabled>-- Selecciona de dónde sale --</option>
                                        {listaCuentas.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 py-3 rounded-xl font-extrabold">Pagar</button></div>
                            </form>
                        </div>
                    )}

                    {modalVisible === 'transferirUtilidad' && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <form onSubmit={transferirUtilidadBinance} className="bg-neutral-900 border border-neutral-800 p-5 rounded-2xl max-w-md w-full space-y-4 my-auto">
                                <h3 className="font-bold text-white text-lg">⇄ Transferir Utilidad</h3>
                                <div><label className="text-xs text-emerald-400 font-bold">Monto (COP)</label><input type="number" required value={formTransferUtilidad.montoCOP} onChange={e => setFormTransferUtilidad({ ...formTransferUtilidad, montoCOP: e.target.value })} className="w-full bg-black border border-emerald-500/50 text-white font-bold text-lg rounded-xl p-3 mt-1" /></div>
                                <div>
                                    <label className="text-xs text-neutral-400">Destino</label>
                                    <select required value={formTransferUtilidad.cuentaDestinoId} onChange={e => setFormTransferUtilidad({ ...formTransferUtilidad, cuentaDestinoId: e.target.value })} className="w-full bg-black border border-neutral-800 text-white font-bold rounded-xl p-3 mt-1">
                                        <option value="" disabled>-- Entra a --</option>
                                        {listaCuentas.filter(c => c.moneda !== 'USD' && c.tipo !== 'Inversión').map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                                    </select>
                                </div>
                                <div className="flex gap-2 pt-2"><button type="button" onClick={() => setModalVisible(null)} className="w-1/2 bg-black text-neutral-300 py-3 rounded-xl font-bold border border-neutral-800">Cancelar</button><button type="submit" className="w-1/2 bg-emerald-500 text-neutral-950 py-3 rounded-xl font-extrabold">Transferir</button></div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Aplicacion/>);
    </script>
</body>
</html>
